<style>
  .hero-banner{position:relative;height:320px;margin-top:-74px;display:grid;place-items:center;color:#fff;text-align:center;overflow:hidden}
  .hero-banner .ph{position:absolute;inset:0}
  .hero-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,40,38,.35),rgba(20,40,38,.6))}
  .hero-banner .inner{position:relative;z-index:2;padding-top:50px}
  .hero-banner h1{color:#fff}
  .feature{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center;background:var(--paper);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
  @media(max-width:780px){.feature{grid-template-columns:1fr}}
  .feature .ph{aspect-ratio:16/10;min-height:280px}
  /* aspect-ratio stated explicitly: height:100% resolves to auto here, so without it the
     slot falls back to the component's default ratio. Matches .feature .ph and the
     mobile rule below, which both already say 16/10. */
  .feature image-slot{display:block;width:100%;height:100%;min-height:280px;aspect-ratio:16/10}
  @media(max-width:780px){.feature .ph{min-height:0;width:100%}.feature image-slot{min-height:0;height:auto;aspect-ratio:16/10}}
  .feature .fbody{padding:30px}
  .feature h2{font-size:1.7rem;margin:.4rem 0 .6rem}
  .bcard{transition:transform .2s}
  .bcard:hover{transform:translateY(-4px)}
  .bcard .ph{aspect-ratio:16/10;border-radius:var(--r)}
  .bcard h3{font-size:1.1rem;margin:14px 0 .3rem;line-height:1.25}
  .bcard .meta{font-size:.76rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em}
  .bcard p{font-size:.9rem;color:var(--ink-soft)}
  .bcard a.more{color:var(--accent-deep);font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:.3rem}
  .bcard a.more svg,.bcard .more svg{width:16px;height:16px;flex:none}
  .cats{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
</style>

<script>
  initChrome({active:'blog.html', onDark:true});
  // [title, slug, kicker, minutes, published, dek]. Read times are the real
  // word count of each article at ~220 wpm; dates are the original publish
  // dates carried over from WordPress. Both are generated alongside the post
  // pages by tools/generate-static-pages.mjs (see blogIndex()).
  const posts=[
    ['Why we started Ceylon Hop','why-we-started-ceylon-hop','Story',3,'2025-05-06','The friendship, the road trips, and the messy bus rides that turned into a travel company.'],
    ['The ultimate tuk-tuk guide to Sri Lanka','ultimate-tuk-tuk-guide-to-getting-around-in-sri-lanka','Guide',3,'2025-05-06','How to flag one, what to pay, and why a fixed price beats haggling on the long hops.'],
    ['Best time to visit Sri Lanka: a month-by-month guide','best-time-to-visit-sri-lanka-a-month-by-month-guide','Planning',8,'2025-03-03','Two monsoons, two coasts — here&rsquo;s how to always be on the sunny side of the island.'],
    ['9 must-visit places in Sri Lanka','9-must-visit-places-in-sri-lanka','List',3,'2025-03-03','From Sigiriya&rsquo;s Lion Rock to whale season in Mirissa, the stops worth building a trip around.'],
    ['Discover Sri Lanka with Ceylon Hop','discover-sri-lanka-with-ceylon-hop-your-ultimate-travel-adventure','Story',2,'2025-02-24','Why exploring the island at your own pace beats a fixed itinerary — one stop at a time.']
  ];
  const DATE_FMT=new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});
  document.getElementById('posts').innerHTML=posts.map(([t,slug,kicker,mins,date,d],i)=>`
    <a class="bcard" href="${slug}/">
      <image-slot id="blog-post-${i}" shape="rounded" radius="16" src="img/blog-post-${i}.jpg" style="display:block;width:100%;aspect-ratio:16/10" placeholder="Drop a photo — ${t}"></image-slot>
      <div class="meta" style="margin-top:14px">${kicker} · ${mins} min · <time datetime="${date}">${DATE_FMT.format(new Date(date+'T00:00:00Z'))}</time></div>
      <h3>${t}</h3>
      <p>${d}</p>
      <span class="more">Read more ${ICON.arrow}</span>
    </a>`).join('');
</script>
