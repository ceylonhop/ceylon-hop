<script>
// The ?t= link token authorises viewing this booking AND minting a checkout token for it, so it
// must leave the address bar BEFORE the tag snippet below: GTM loads async and can run while the
// parser waits on the synchronous scripts after it, and GA4 page_location, Clarity and the pixels
// all read location.href (security review 2026-10-25 — pay.html does the same). `rt` and `c`, the
// PayHere return leg, go too. The page script reads all three from window.CH_MANAGE_LINK.
// checkout-handoff.js loads just above so the key name stays the shared one.
(function(){
  var link = { t: null, rt: null, c: false };
  try {
    var u = new URL(location.href), q = u.searchParams;
    link.t = q.get('t'); link.rt = q.get('rt'); link.c = q.get('c') === '1';
    var strip = [];
    if (link.rt !== null) strip.push('rt');
    if (q.has('c')) strip.push('c');
    // If storage throws, `t` stays in the URL: a customer who cannot reload their own booking is
    // a broken page. Function first, privacy wherever it is free.
    if (link.t) {
      try { sessionStorage.setItem(window.CH_MANAGE_TOKEN_KEY, link.t); strip.push('t'); } catch (e) {}
    }
    if (strip.length) {
      strip.forEach(function(k){ q.delete(k); });
      history.replaceState(null, '', u.pathname + u.search + u.hash);
    }
  } catch (e) {}
  window.CH_MANAGE_LINK = link;
})();
</script>

<script>
(function(){
  'use strict';
  // "Your booking" — the page a customer reaches from a confirmation email or from the ops
  // booking drawer's payment link. It is the SAME travel document as pay.html (ticket.css):
  // a customer following either link should not be able to tell they landed on a different
  // system. Everything here is derived from the booking; nothing is typed on this page.
  var app = document.getElementById('app');
  // The ?t= link token authorises viewing this booking AND minting a checkout token for it. The
  // first script in <head> read it (with `rt` and `c`), stashed it in sessionStorage and took it
  // out of the URL before any tag could see it; on a reload it comes back from storage.
  // The key's name is shared with booking.html, which hands a website customer's token over here.
  var TOKEN_KEY = window.CH_MANAGE_TOKEN_KEY;
  var link = window.CH_MANAGE_LINK || {};
  var t = link.t;
  // Set only on the leg BACK from PayHere (the server builds that address — see returnTo below).
  // `rt` is a status-only token for /bookings/pay-return; `c=1` means the gateway used cancel_url,
  // a display hint and NEVER an outcome. Both are read once and taken out of the address bar with
  // `t`, so a reload after the return simply shows the booking as it now stands. That address
  // carries NO `t`: this page (or booking.html, for a website checkout) stashes it right before
  // the hand-off, and it is read back below like any reload.
  var rt = link.rt;
  var cameFromCancel = link.c === true;
  if (!t) {
    try { t = sessionStorage.getItem(TOKEN_KEY); } catch (e) {}
  }
  var A = (window.CEYLON_HOP_API || '').replace(/\/$/, '');

  function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}
  function waLine(){return '<div class="pp-note">Questions? <a href="https://wa.me/94779669662">WhatsApp us</a> — our team replies during Sri Lanka service hours.</div>';}

  // Clarity masks form INPUTS by default, not rendered text — and the greeting carries the
  // customer's first name. The booking reference stays legible on purpose: it is the join key
  // back to the booking, and a replay you cannot tie to an order answers nothing.
  var MASK = ' data-clarity-mask="true"';

  // ── funnel + failure reporting (2026-08-07) ─────────────────────────────────────────
  // The booking-management page pushed nothing, so a customer coming back to pay a balance
  // was invisible until the money either arrived or didn't. Guarded; no PII ever.
  function track(event, params){
    if (typeof window.chTrack === 'function') window.chTrack(event, params || {});
  }
  function report(what, err){
    var x = err || {};
    if (typeof window.chReportError === 'function') {
      window.chReportError('[manage] ' + what + (x.message ? ' — ' + x.message : ''), x.stack);
    }
  }
  // Same gates as pay.html: `purchase` becomes revenue and GA4 cannot take it back, so a
  // sandbox checkout must never reach it. The return leg never sees the checkout URL, so WHICH
  // gateway took the money comes from our server's pay-return answer (`sandbox`, the payment
  // adapter's mode) — only an explicit `false` counts, so an answer that doesn't say fails closed.
  // And it fires once per booking whatever the customer does with the back button.
  var STORE = 'ch_manage_pay_v1';
  function trackPurchase(v, sandbox){
    if (sandbox !== false) return;
    if (typeof window.chIsProd !== 'function' || !window.chIsProd()) return;
    var seen = STORE + ':purchased';
    try {
      if (sessionStorage.getItem(seen) === String(v.reference || '1')) return;
      sessionStorage.setItem(seen, String(v.reference || '1'));
    } catch (e) { /* private mode — better a possible double than a missing purchase */ }
    var p = {
      transaction_id: String(v.reference || ''),
      value: Math.round(Number(v.amountDueNowCents || 0)) / 100,
      currency: v.currency || 'USD',
    };
    // /view's ga4Item is the server purchase's own item (route, private/shared, regions); absent
    // from an older API, in which case the purchase simply goes without one.
    if (v.ga4Item && typeof v.ga4Item === 'object') p.items = [Object.assign({}, v.ga4Item, { price: p.value, quantity: 1 })];
    track('purchase', p);
  }
  function moneyOf(v){
    return { value: Math.round(Number(v && v.amountDueNowCents || 0)) / 100, currency: (v && v.currency) || 'USD' };
  }

  // Money the way the pay page shows it: USD gets its symbol and both decimals, so $229.00
  // reads as a price rather than a value out of a database.
  function money(cents, cur){
    var n = (Number(cents || 0) / 100).toFixed(2);
    return (cur || 'USD') === 'USD' ? '$' + n : (cur + ' ' + n);
  }

  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  // '2026-07-22' → 'Wednesday 22 July 2026'. Built from UTC parts, never new Date(string),
  // which lands on the previous day for anyone west of Greenwich.
  function longDate(iso){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
    if (!m) return iso ? String(iso) : '';
    var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return DAYS[d.getUTCDay()] + ' ' + (+m[3]) + ' ' + MONTHS[+m[2] - 1] + ' ' + m[1];
  }
  var MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function isoParts(iso){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '')); return m ? { y:+m[1], mo:+m[2], d:+m[3] } : null; }
  // '22 Jul' — the stamp beside each leg on the rail.
  function stamp(iso){ var p = isoParts(iso); return p ? p.d + ' ' + MON3[p.mo - 1] : ''; }
  // '22–26 July 2026', or '30 July – 3 August 2026' across a month boundary.
  function rangeLabel(a, b){
    var x = isoParts(a), y = isoParts(b);
    if (!x || !y) return '';
    if (x.y === y.y && x.mo === y.mo) return x.d + '\u2013' + y.d + ' ' + MONTHS[x.mo - 1] + ' ' + x.y;
    return x.d + ' ' + MONTHS[x.mo - 1] + ' \u2013 ' + y.d + ' ' + MONTHS[y.mo - 1] + ' ' + y.y;
  }
  var NUMWORD = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
  function countWord(n){ return NUMWORD[n] || String(n); }
  // A journey is a LEG — the hop between two stops — so four stops is three journeys.
  function legsOf(v){
    var stops = (v && v.stops && v.stops.length >= 2) ? v.stops : [v.from, v.to];
    var dates = (v && v.legDates) || [];
    var out = [];
    for (var i = 0; i < stops.length - 1; i++) out.push({ route: stops[i] + ' \u2192 ' + stops[i + 1], date: dates[i] || null });
    return out;
  }

  function vehicleLabel(v){
    if (!v) return 'To be confirmed';
    if (/van/i.test(v)) return 'Van';
    if (/car/i.test(v)) return 'Private car';
    return String(v).charAt(0).toUpperCase() + String(v).slice(1);
  }
  // ---- Pickup date/time, set once by the customer (dateless capture Phase 4) ----
  // An airport pickup is asked for its LANDING time (owner, 2026-10-21) — same test as payPageCopy.ts.
  function isAirport(v){
    return /airport|cmb|katunayake/i.test(String((v && v.from) || ''));
  }
  // booking.js:1010 — the booking page's own format, so a customer sees the same "9:00 am" twice.
  function fmtTime(t){
    var h = +t.slice(0, 2);
    return ((h + 11) % 12 + 1) + ':' + t.slice(3, 5) + ' ' + (h < 12 ? 'am' : 'pm');
  }
  // booking.js:1017 — the booking page's slot labels, verbatim.
  function slotLabel(h){
    return h < 5 ? 'Night pickup' : (h < 8 ? 'Early start' : (h < 12 ? 'Morning pickup' : (h < 17 ? 'Afternoon pickup' : (h < 20 ? 'Evening pickup' : 'Night pickup'))));
  }
  // What the card asks for; null = no card. Only a paid single transfer with a blank is editable here
  // (the server's SCHEDULE_EDITABLE_STATUSES + mode check, mirrored).
  function pickupNeeds(v){
    if (!v || v.mode !== 'single' || (v.status !== 'paid' && v.status !== 'confirmed')) return null;
    var noDate = !v.date || v.date === 'to confirm', noTime = !v.time || v.time === 'to confirm';
    return noDate && noTime ? 'both' : noDate ? 'date' : noTime ? 'time' : null;
  }
  // Hotel pickups: the booking page's hourly list (site.js hourlyTimes). Airports: every 15 minutes,
  // because a flight lands at 8:40, not on the hour (owner, 2026-10-21).
  function timeChoices(v){
    var air = isAirport(v), step = air ? 15 : 60, out = [];
    for (var m = 0; m < 24 * 60; m += step) {
      var h = Math.floor(m / 60), t = (h < 10 ? '0' : '') + h + ':' + (m % 60 < 10 ? '0' : '') + (m % 60);
      out.push({ value: t, label: fmtTime(t) + (air ? '' : ' · ' + slotLabel(h)) });
    }
    return out;
  }
  // 'Wed 4 Nov' — built from UTC parts, like longDate().
  function shortDate(iso){
    var p = isoParts(iso);
    if (!p) return '';
    var d = new Date(Date.UTC(p.y, p.mo - 1, p.d));
    return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getUTCDay()] + ' ' + p.d + ' ' + MON3[p.mo - 1];
  }
  // The button says exactly what it will save — the set-once confirmation lives in its label —
  // or, while it can't save, what is missing.
  function saveLabel(v, date, time, noTime, soon){
    var air = isAirport(v);
    if (!date) return { text: 'Choose a date', ready: false };
    if (soon) return { text: 'Too soon to set here', ready: false };
    if (!time && !noTime) return { text: air ? 'Choose a landing time' : 'Choose a pick-up time', ready: false };
    return { text: 'Save ' + (air ? 'landing ' : '') + shortDate(date) + ' · ' + (noTime ? 'time later' : fmtTime(time)), ready: true };
  }
  var IC_CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke-dasharray="3.3 3.3"/><path d="M12 12V7.6M12 12l3.5 2.1"/></svg>';
  var IC_PLANE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17h18M5.5 13.5l3.2-.9L6 7.5l1.6-.5 5 4.3 4.6-1.3a1.6 1.6 0 0 1 .9 3.1L6.6 16"/></svg>';
  var IC_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8.5 12.5l2.4 2.4 4.8-5"/><circle cx="12" cy="12" r="9"/></svg>';
  var IC_INFO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>';
  var WA_LINK = '<a href="https://wa.me/94779669662" target="_blank" rel="noopener">WhatsApp us</a>';
  var cardMode = null; // null | 'open' | 'saved' | 'conflict'
  var cardFail = false;
  // 12 h notice in Sri Lanka time (UTC+5:30), as booking.js and the server's isTooSoonPrivate do.
  // The server re-checks; this only stops the button offering what will be refused.
  function tooSoon(iso, time){
    var p = isoParts(iso); if (!p) return false;
    var q = (time || '23:59').split(':').map(Number);
    return Date.UTC(p.y, p.mo - 1, p.d, q[0], q[1]) - 330 * 60000 - Date.now() < 12 * 3600000;
  }
  function pickupCard(v){
    var air = isAirport(v), icon = air ? IC_PLANE : IC_CLOCK;
    if (cardMode === 'saved') return '<div class="pk ok" id="pickup"><div class="pk-top"><span class="pk-ic">' + IC_OK + '</span><div>'
      + '<h2>Pick-up set</h2><p><b>' + esc(shortDate(v.date)) + (v.time && v.time !== 'to confirm' ? ' · ' + esc(fmtTime(v.time)) + '</b> Sri Lanka time' : '</b>, time to follow')
      + '. We’ve emailed you a copy.</p><p style="margin-top:6px">Need to change it? ' + WA_LINK + '.</p></div></div></div>';
    if (cardMode === 'conflict') return '<div class="pk info" id="pickup"><div class="pk-top"><span class="pk-ic">' + IC_INFO + '</span><div>'
      + '<h2>Our team has already set your pick-up</h2><p><b>' + esc(shortDate(v.date))
      + (v.time && v.time !== 'to confirm' ? ' · ' + esc(fmtTime(v.time)) : '') + '</b> Sri Lanka time, so we didn’t save yours.</p>'
      + '<p style="margin-top:6px">Not right? ' + WA_LINK + ' and we’ll fix it.</p></div></div></div>';
    var needs = pickupNeeds(v);
    if (!needs) return '';
    if (needs !== 'time' && cardMode !== 'open') return '<div class="pk" id="pickup"><div class="pk-top"><span class="pk-ic">' + icon + '</span><div>'
      + '<h2>' + (air ? 'Add your landing date' : 'Add your pick-up date') + (needs === 'date' ? '' : ' &amp; time') + '</h2>'
      + '<p>You booked with “Decide later”. Add it here once you know, and we’ll book your driver.</p></div></div>'
      + '<button class="btn btn-primary" id="pkopen">Add date' + (needs === 'date' ? '' : ' &amp; time') + '</button>'
      + '<div class="pk-fine">You can set this once. To change it afterwards, ' + WA_LINK + '.</div></div>';
    var timeOnly = needs === 'time', dateOnly = needs === 'date';
    var opts = '<option value="" selected disabled>' + (air ? 'Choose a landing time…' : 'Choose a pick-up time…') + '</option>'
      + timeChoices(v).map(function(c){ return '<option value="' + c.value + '">' + esc(c.label) + '</option>'; }).join('');
    return '<div class="pk" id="pickup"><div class="pk-top"><span class="pk-ic">' + icon + '</span><div>'
      + '<h2>' + (timeOnly ? (air ? 'Add your landing time' : 'Add your pick-up time') : dateOnly ? (air ? 'Add your landing date' : 'Add your pick-up date')
          : (air ? 'When does your flight land?' : 'When should we pick you up?')) + '</h2>'
      + '<p>' + (air ? 'Your driver will be waiting at arrivals in ' + esc(v.from) + '.' : 'From ' + esc(v.from) + ', any time of day.') + '</p></div></div>'
      + '<div class="pk-row"><span class="pk-lbl">' + (air ? 'Landing date' : 'Pick-up date') + '</span></div>'
      + (timeOnly
          ? '<div class="pk-fixed">' + esc(shortDate(v.date)) + (v.scheduleSetBy === 'staff' ? '<small>set by our team</small>' : '') + '</div>'
          : '<input type="date" id="pkdate" data-placeholder="Choose a date" aria-label="' + (air ? 'Landing date' : 'Pick-up date') + '">')
      + '<div class="pk-row"><span class="pk-lbl">' + (air ? 'Landing time' : 'Pick-up time') + ' <i>· Sri Lanka time</i></span>'
      + (timeOnly || dateOnly ? '' : '<label class="pk-chk"><input type="checkbox" id="pkdk"> Don’t know yet</label>') + '</div>'
      + (dateOnly
          ? '<div class="pk-fixed">' + esc(fmtTime(v.time)) + (v.scheduleSetBy === 'staff' ? '<small>set by our team</small>' : '') + '</div>'
          : '<select id="pktime" aria-label="' + (air ? 'Landing time' : 'Pick-up time') + '">' + opts + '</select>'
            + '<div class="pk-pill" id="pkpill" hidden>No time yet. You can add it here later.</div>')
      + '<div class="pk-err" id="pkerr" role="alert" hidden>That’s less than 12 hours away, too soon to set here. ' + WA_LINK + ' and we’ll do our best to fit you in.</div>'
      + '<div class="pk-err" id="pkfail" role="alert"' + (cardFail ? '' : ' hidden') + '>We couldn’t save that, so nothing has changed. Try again, or ' + WA_LINK + '.</div>'
      + '<button class="btn btn-primary" id="pksave" disabled>Choose a date</button>'
      + '<div class="pk-fine">Once saved, changes go through ' + WA_LINK + '.</div>'
      + (timeOnly ? '' : '<button class="pk-later" id="pklater">Not now</button>') + '</div>';
  }
  function wirePickup(v){
    var open = document.getElementById('pkopen');
    if (open) open.addEventListener('click', function(){ cardMode = 'open'; render(v); focusCard(); });
    var later = document.getElementById('pklater');
    if (later) later.addEventListener('click', function(){ cardMode = null; render(v); });
    var dIn = document.getElementById('pkdate'), tIn = document.getElementById('pktime');
    if (!dIn && !tIn) return;
    if (dIn && window.enhanceDate) window.enhanceDate(dIn);
    var dk = document.getElementById('pkdk'), pill = document.getElementById('pkpill');
    var err = document.getElementById('pkerr'), fail = document.getElementById('pkfail'), save = document.getElementById('pksave');
    function state(){ return { date: dIn ? dIn.value : v.date, time: tIn ? tIn.value : v.time, noTime: !!(dk && dk.checked) }; }
    var busy = false; // a save is in flight: no input change may re-enable Save
    function upd(){
      var s = state();
      if (tIn) { tIn.hidden = s.noTime; pill.hidden = !s.noTime; }
      var soon = !!s.date && tooSoon(s.date, s.noTime ? '' : s.time);
      err.hidden = !soon;
      var label = saveLabel(v, s.date, s.time, s.noTime, soon);
      save.textContent = label.text; save.disabled = busy || !label.ready;
    }
    [dIn, tIn, dk].forEach(function(el){ if (el) el.addEventListener('change', function(){ fail.hidden = true; upd(); }); });
    upd();
    // A reply that never arrived, or an answer that doesn't say what's stored, proves nothing:
    // ask the server what it holds. 'saved' | 'conflict' | null (nothing changed on the server).
    function outcome(fresh, sentDate, sentTime){
      var before = pickupNeeds(v), now = pickupNeeds(fresh);
      if (fresh.date === sentDate && (sentTime === null || fresh.time === sentTime)) return 'saved';
      if (now === before) return null;
      return fresh.scheduleSetBy === 'customer' ? 'saved' : fresh.scheduleSetBy === 'staff' ? 'conflict' : null;
    }
    save.addEventListener('click', function(){
      var s = state();
      var sentDate = dIn ? s.date : v.date, sentTime = s.noTime ? null : s.time;
      busy = true; save.disabled = true;
      function failed(cause){
        report('bookings/view/schedule failed', cause);
        busy = false; fail.hidden = false; upd();
      }
      function recover(cause){
        return loadView().then(function(fresh){
          var how = outcome(fresh, sentDate, sentTime);
          if (!how) return failed(cause);
          cardMode = how; cardFail = false; render(fresh);
          if (how === 'saved') focusCard();
        }, function(){ failed(cause); });
      }
      fetch(A + '/bookings/view/schedule', {
        method: 'POST',
        headers: { 'content-type': 'application/json', authorization: 'Bearer ' + t },
        // Send only what this card fills: a date ops already set goes back unchanged (set-once).
        body: JSON.stringify({ date: sentDate, time: sentTime }),
      }).then(function(res){
        return res.json().catch(function(){ return {}; }).then(function(b){ return { status: res.status, body: b }; });
      }).then(function(r){
        if (r.status === 200 && r.body.view) { cardMode = 'saved'; cardFail = false; render(r.body.view); focusCard(); return; }
        // The server's clock wins over the page's: show the 12 h message even if upd() thought it fine.
        if (r.status === 400 && (r.body.error === 'too_soon' || r.body.error === 'past')) {
          busy = false; upd(); err.hidden = false;
          save.textContent = saveLabel(v, s.date, s.time, s.noTime, true).text; save.disabled = true;
          return;
        }
        return recover(new Error('schedule ' + r.status + (r.body.error ? ' ' + r.body.error : '')));
      }, function(e){ return recover(e); }).catch(function(e){ failed(e); });
    });
  }
  // After a re-render, keep the card where the customer is looking.
  function focusCard(){ var el = document.getElementById('pickup'); if (el) el.scrollIntoView({ block: 'start' }); }
  // The booking's status is a DATABASE enum. A traveller gets told what it means for them —
  // never "payment_pending", which is what this page used to print at them.
  function statusChip(status, needsPricing){
    // An open booking the server couldn't price isn't awaiting payment yet — nothing can be paid.
    if (needsPricing && (status === 'draft' || status === 'payment_pending')) return '<span class="t-stat wait">Price to confirm</span>';
    var s = {
      draft:            ['wait', 'Awaiting payment'],
      payment_pending:  ['wait', 'Awaiting payment'],
      paid:             ['ok',   'Confirmed'],
      confirmed:        ['ok',   'Confirmed'],
      completed:        ['ok',   'Completed'],
      cancelled:        ['off',  'Cancelled'],
      refunded:         ['off',  'Refunded']
    }[status];
    return s ? '<span class="t-stat ' + s[0] + '">' + s[1] + '</span>' : '';
  }

  // Every path that replaces the first-paint skeleton goes through here. Clearing aria-busy
  // matters as much as clearing the class: a screen reader announcing "busy" over a booking
  // that is already on screen is worse than never announcing it.
  function paint(html){
    app.innerHTML = html;
    app.classList.remove('tk-sk');
    app.removeAttribute('aria-busy');
    app.removeAttribute('aria-label');
  }

  function errView(msg){
    paint('<div class="st-wrap"><div class="st-badge warn">!</div>'
      + '<h1 class="st-title">We couldn’t open this booking</h1>'
      + '<p class="st-sub">' + esc(msg) + '</p></div>' + waLine());
  }

  // A booking can only be charged while it is genuinely open and something is owed. Offering
  // payment on a settled booking is how somebody pays twice; the backend refuses it too.
  // An unpriced booking (needsPricing) carries a placeholder total checkout refuses: never payable.
  function payable(v){ return (v.status === 'draft' || v.status === 'payment_pending') && v.amountDueNowCents > 0 && !v.needsPricing; }

  // The title has to survive a four-stop tour. "first → last" reads exactly like a direct
  // transfer and hides the middle, so a real trip leads with what it IS — how many journeys, over
  // which dates — and the rail underneath names every hop.
  // A direct transfer names each end the way the booking page does (CH-9QH34: two full Google
  // addresses made a six-line heading on a phone); the full address is on the ticket's From / To rows.
  // Without ch-shortplace.js the full address stands — a long heading, never a broken page.
  function shortEnd(p){ return window.CH && window.CH.shortPlace ? window.CH.shortPlace(p) : p; }
  function titleOf(v){
    var legs = legsOf(v);
    if (legs.length <= 1) return shortEnd(v.from) + ' → ' + shortEnd(v.to);
    var range = rangeLabel(v.date, v.endDate);
    var word = countWord(legs.length);
    return word.charAt(0).toUpperCase() + word.slice(1) + ' journeys' + (range ? ', ' + range : '');
  }
  function subtitleOf(v){
    var legs = legsOf(v);
    if (legs.length <= 1) return isoParts(v.date) ? longDate(v.date) : 'Pick-up date not set yet';
    // Short, like the heading: the rail underneath carries every full address.
    return shortEnd(v.from) + ' → ' + shortEnd(v.to);
  }
  function factsOf(v){
    var legs = legsOf(v);
    var stopCount = legs.length + 1;
    // A one-day trip genuinely starts and ends on the same date; say so rather than printing
    // the same line twice with no explanation.
    var sameDay = isoParts(v.date) && v.date === v.endDate;
    // The API sends 'to confirm' for a blank date/time. Only where the customer can fill the blank
    // (pickupNeeds non-null) does it read as a to-do chip; elsewhere it stays plain "To be confirmed".
    var needs = pickupNeeds(v);
    var noDate = !v.date || v.date === 'to confirm', noTime = !v.time || v.time === 'to confirm';
    var rows = [];
    // Only when the heading shortened an end — otherwise the row would repeat the title word for word.
    if (legs.length <= 1 && (shortEnd(v.from) !== v.from || shortEnd(v.to) !== v.to)) {
      rows.push({ k: 'From', v: v.from }, { k: 'To', v: v.to });
    }
    rows.push(
      { k: 'Trip start', v: noDate ? 'To be confirmed' : longDate(v.date), blank: noDate, sub: v.scheduleSetBy === 'staff' ? 'set by our team' : '' },
      { k: 'Trip end', v: isoParts(v.endDate) ? longDate(v.endDate) : 'To be confirmed', sub: sameDay ? 'same day' : '' },
      { k: v.mode === 'single' && isAirport(v) ? 'Landing time' : 'Pick-up time',
        v: noTime ? 'To be confirmed' : fmtTime(v.time), blank: noTime,
        sub: noTime ? '' : 'Sri Lanka time' },
      // Asked for on every card, not just the multi-stop ones: "2 stops" on a direct transfer
      // still answers "is there anything else on this trip?".
      { k: 'Stops', v: stopCount + ' stops', sub: legs.length <= 1 ? 'direct' : '' }
    );
    // The local road the customer chose (the view carries it only then), in the emails' words.
    if (v.road) rows.push({ k: 'Road', v: v.road });
    rows.push(
      { k: 'Travellers', v: String(v.travellers) },
      { k: 'Vehicle', v: vehicleLabel(v.vehicleType) }
    );
    // The add-ons the customer chose, as the quote named them. Only when there are some.
    if (v.addOns && v.addOns.length) rows.push({ k: 'Extras', lines: v.addOns });
    return rows.map(function(r){
      var val = r.lines ? r.lines.map(function(l){ return esc(l); }).join('<br>') : esc(r.v);
      // A blank the customer can fill is something to do, not a fact: say so plainly.
      if (r.blank && needs) val = '<span class="need">Not set yet</span>';
      return '<div class="fact"><span class="k">' + esc(r.k) + '</span><span class="v">' + val
        + (r.sub ? '<small>' + esc(r.sub) + '</small>' : '') + '</span></div>';
    }).join('');
  }

  // Shared with pay.html and booking.html — see decline-help.js for why this copy says what it says.
  var DECLINE_HELP = window.CH_DECLINE_HELP || [];
  // `quiet` collapses the steps behind a summary: available, not asserted — for a return with no
  // verdict, where most people simply changed their mind (pay.html's fail() explains the case).
  function helpHtml(help, quiet){
    if (!help || !help.length) return '';
    var steps = '<ol>' + help.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>';
    return quiet
      ? '<details class="pp-quiet"><summary>Card refused? Here’s what usually fixes it</summary>' + steps + '</details>'
      : '<h3>If your card was declined</h3>' + steps;
  }

  // The one-tap "tell us what happened" link booking.html's payment overlay carries (#766): the
  // only source that can say what a customer saw at the gateway is the customer, and a message
  // that already names the booking saves them finding the reference. Since the website checkout
  // became a redirect (2026-09-24) a failed payment is answered HERE, so the link is shown on the
  // two states that mean it didn't work — a decline and the cancel leg — and nowhere else.
  function waTellUsHref(v){ return window.chTellUsHref(v && v.reference, 'failed'); }
  function showTellUs(){
    var a = document.getElementById('paywa');
    if (a) a.hidden = false;
  }
  // The same link, standalone, for the screens that have no booking to rebuild.
  function tellUsLink(reference){
    return '<a class="btn btn-ghost pp-cta pp-tellus" id="paywa" href="' + esc(waTellUsHref({ reference: reference }))
      + '" target="_blank" rel="noopener">Tell us what happened on WhatsApp</a>';
  }

  // What is still owed. A zero balance is not news — it earns a row only when something is left to
  // pay. A pay-on-the-day booking owes USD cash to the team at the first pickup, so it says so.
  function dueRows(v, due){
    if (!(due > 0)) return '';
    var arranged = !!v.paymentArrangement;
    return '<div class="tot due"><span class="l">' + (arranged ? 'To pay on the day (cash, USD)' : 'Balance due')
      + '</span><span class="v">' + esc(money(due, v.currency)) + '</span></div>'
      + (arranged ? '<div class="paysub">Please pay the Ceylon Hop team in cash at your first pickup.</div>' : '');
  }

  function render(v, errMsg, help, quiet, tellUs){
    var due = Number(v.balanceDueCents || 0);
    var promo = !!v.promoCode && Number(v.discountCents || 0) > 0;
    var html =
      '<div class="pp-hello"' + (v.firstName ? MASK : '') + '>' + (v.firstName ? 'Hi ' + esc(v.firstName) + ',' : 'Your booking') + '</div>'
      + '<h1 class="pp-title">' + esc(titleOf(v)) + '</h1>'
      + '<p class="pp-sub">' + esc(subtitleOf(v)) + '</p>'
      + pickupCard(v)
      + '<div class="ticket"><div class="t-main">'
      + '<div class="t-head"><span class="t-ref">Booking ' + esc(v.reference) + '</span>'
      + statusChip(v.status, v.needsPricing) + '</div>'
      // A trip with stops in the middle shows every journey; a direct transfer has nothing to
      // add beyond its title, so it skips the rail rather than drawing a rail of one.
      + (legsOf(v).length > 1 ? '<div class="hops">' + legsOf(v).map(function(l, i, all){
          var last = i === all.length - 1;
          return '<div class="hop"><div class="hop-rail"><span class="hop-dot' + (last ? ' end' : '') + '"></span>'
            + (last ? '' : '<span class="hop-line"></span>') + '</div>'
            + '<div><div class="hop-t">' + esc(l.route) + '</div>'
            + '<div class="hop-d">' + (l.date ? esc(stamp(l.date)) : 'date to be confirmed') + '</div></div></div>';
        }).join('') + '</div>' : '')
      + factsOf(v)
      + '</div><div class="perf"></div><div class="t-stub">';
    // The total on an unpriced booking is a placeholder, not a price: say what happens instead.
    if (v.needsPricing) {
      html += '<p class="pp-tbc">We’re confirming the price for this trip by hand — we’ll message you on WhatsApp with a payment link.</p>'
        + '<a class="btn btn-ghost pp-cta pp-tellus" id="pricewa" href="' + esc(window.chTellUsHref(v.reference, 'contact'))
        + '" target="_blank" rel="noopener">Message us on WhatsApp</a>';
    } else {
      // The promo code the booking was made with, and what it took off — only on such a booking.
      html += (promo ? '<div class="tot tot-sub tot-disc"><span class="l">Promo ' + esc(v.promoCode) + '</span><span class="v">−'
          + esc(money(v.discountCents, v.currency)) + '</span></div>' : '')
        + '<div class="tot' + (promo ? ' tot-final' : '') + '"><span class="l">Total</span><span class="v">' + esc(money(v.totalCents, v.currency)) + '</span></div>'
        + dueRows(v, due);
    }

    if (payable(v)) {
      html += '<button class="btn btn-cta pp-cta" id="paybtn">Pay with PayHere</button>'
        + '<div class="paysub">Pay securely to confirm. ' + esc(money(v.amountDueNowCents, v.currency)) + ' — no extra fees.</div>'
        + '<div class="badges"><span class="card-badge"><span class="visa">VISA</span></span>'
        + '<span class="card-badge">MASTERCARD</span><span class="card-badge">AMEX</span></div>'
        + '<p class="pp-err" id="payerr"' + (errMsg ? '' : ' hidden') + '>' + esc(errMsg || '') + '</p>'
        // Only after a real attempt at the gateway — see helpHtml().
        + '<div class="pp-help" id="payhelp"' + (help && help.length ? '' : ' hidden') + '>' + helpHtml(help, quiet) + '</div>'
        + '<a class="btn btn-ghost pp-cta pp-tellus" id="paywa" href="' + esc(waTellUsHref(v)) + '" target="_blank" rel="noopener"'
        + (tellUs ? '' : ' hidden') + '>Tell us what happened on WhatsApp</a>';
    }
    html += '</div></div>' + waLine();
    paint(html);
    wirePickup(v);
    if (location.hash === '#pickup' && cardMode === 'open') focusCard();
    var btn = document.getElementById('paybtn');
    if (btn) btn.addEventListener('click', function(){
      track('begin_checkout', {
        value: Math.round(Number(v.amountDueNowCents || 0)) / 100,
        currency: v.currency || 'USD',
      });
      pay(v);
    });
  }

  // Shown between the press and the browser leaving for payhere.lk. It no longer says "don't
  // close this page": the customer is being sent TO PayHere, not shown a window on top of us.
  function renderLoading(v){
    paint('<div class="pp-loading"><div class="pp-spin"></div>'
      + '<h2>Taking you to PayHere…</h2>'
      + '<p>You’ll finish paying on PayHere’s own secure page, then come straight back here. We never see your card details.</p>'
      + '<div class="amt">' + esc(money(v.amountDueNowCents, v.currency)) + '</div>'
      + '<p>🔒 PayHere · Sri Lanka’s Central Bank-approved gateway</p>'
      // Owner-observed on the live gateway (2026-08-05, pay.html): PayHere parks the payer on
      // "Payment Approved"/"Declined" behind a manual "Back to Site" link rather than redirecting.
      + '<p>When PayHere is done, tap <strong>Back to Site</strong> to see your booking.</p></div>');
  }

  // Both checkout calls get a deadline — the one pay.html's fetchJson gives every call, and
  // booking.js gave its checkout (#974). The hand-off screen above has no button on it, so an API
  // that accepts the connection and never answers (a saturated pool, an instance mid-restart)
  // otherwise holds the customer on "Taking you to PayHere…" with no way out but a reload. The
  // deadline runs until the BODY is read, not just the headers: a server that answers the headers
  // and then goes quiet traps the customer just the same. Any failure — the deadline, a dropped
  // connection, a body that won't parse — rejects into pay()'s catch in this page's own words (the
  // booking view rebuilt with the error named on it, Pay back), never the browser's "Failed to
  // fetch" or abort wording. The answer exposes only what pay() reads: ok and json().
  var NET_TIMEOUT_MS = 20000;
  function fetchWithDeadline(url, opts){
    opts = opts || {};
    var ctl = typeof AbortController === 'undefined' ? null : new AbortController();
    var timer = ctl ? setTimeout(function(){ ctl.abort(); }, NET_TIMEOUT_MS) : null;
    if (ctl) opts.signal = ctl.signal;
    function failed(){
      clearTimeout(timer);
      return new Error('We couldn’t start your payment just now — no charge was made.');
    }
    return fetch(url, opts).then(function(r){
      return {
        ok: r.ok,
        json: function(){
          return r.json().then(function(x){ clearTimeout(timer); return x; }, function(){ throw failed(); });
        },
      };
    }, function(){ throw failed(); });
  }

  function pay(v){
    // A return-leg poll still running underneath must not repaint over the hand-off.
    handedOff = true;
    stopReturn();
    renderLoading(v);
    // A failure rebuilds the whole booking view with the error named on it — never a dead
    // screen, and never a button whose label has quietly become the error.
    function fail(msg){ render(v, msg); }
    // The link token authorises a checkout token, which authorises the charge. The booking
    // id comes back with it — the view projection withholds it on purpose.
    fetchWithDeadline(A + '/bookings/view/checkout-token', { method: 'POST', headers: { authorization: 'Bearer ' + t } })
      .then(function(r){
        return r.ok ? r.json() : r.json().catch(function(){ return {}; }).then(function(x){
          // Still open, but the server couldn't price it — not "paid or closed". The catch below
          // repaints the card in its awaiting-a-price state.
          if (x.error === 'not_chargeable' && x.reason === 'awaiting_price') {
            var e = new Error('awaiting_price'); e.awaitingPrice = true; throw e;
          }
          throw new Error(x.error === 'not_chargeable'
            ? 'This booking has already been paid or closed.'
            : 'We couldn’t start your payment just now.');
        });
      })
      .then(function(x){
        // `returnTo` states INTENT, never a URL: the server builds the return address (back to
        // this page, on the manage link's own origin) from its own config — a gateway that
        // redirects wherever the request body says is a phishing primitive.
        return fetchWithDeadline(A + '/bookings/' + x.bookingId + '/checkout', {
          method: 'POST',
          headers: { authorization: 'Bearer ' + x.checkoutToken, 'content-type': 'application/json' },
          body: JSON.stringify(typeof window.chWithGa === 'function' ? window.chWithGa({ returnTo: 'manage' }) : { returnTo: 'manage' }),
        })
          .then(function(r){ if (!r.ok) throw new Error('We couldn’t start your payment just now — no charge was made.'); return r.json(); });
      })
      .then(function(checkout){
        if (!checkout || !checkout.checkoutUrl) throw new Error('We couldn’t start your payment just now — no charge was made.');
        // Anything that isn't real PayHere is the dev/fake gateway: send the browser to
        // whatever it returned rather than pretending on this page that money moved.
        if (!/payhere\.lk/.test(checkout.checkoutUrl)) { location.href = checkout.checkoutUrl; return; }
        if (!checkout.fields) throw new Error('We couldn’t start your payment just now — no charge was made.');
        // The last thing we know for certain: they left for the gateway. Everything after this
        // is what our own server tells us on the way back.
        track('payment_initiated', moneyOf(v));
        // The way back carries only the status token `rt`, never `t` (a bearer credential in a URL
        // PayHere stores). The return leg reads `t` from this tab's storage, so make sure it is
        // there now, whatever happened to the copy stashed at load.
        try { sessionStorage.setItem(TOKEN_KEY, t); } catch (e) {}
        // A TOP-LEVEL form POST with the server's fields verbatim (checkout-handoff.js, shared
        // with booking.html).
        window.chSubmitToGateway(checkout);
      })
      .catch(function(e){
        if (e && e.awaitingPrice) return render(Object.assign({}, v, { needsPricing: true }));
        track('payment_start_failed', { reason: String((e && e.message) || 'unknown').slice(0, 60) });
        report('checkout start failed', e);
        fail(e.message);
      });
  }

  // ── the return leg ──────────────────────────────────────────────────────────────────────
  // pay.html's renderReturn(), for this page. PayHere passes NO payment status back on the
  // redirect, so nothing in the URL is read as an outcome: we poll our own server, which the
  // webhook owns. Both legs poll identically — PayHere does not document where a DECLINE lands,
  // and parks every payer behind "Back to Site" — `c=1` only shortens the wait and the words.
  var RETURN_TRIES = 30;
  var CANCEL_TRIES = 8;
  // After this long the booking (and its Pay button) comes back and checking continues
  // underneath, upgrading the moment an answer arrives — owner-reported on pay.html: a spinner
  // held far too long before showing anything useful.
  var FIRST_PAINT_MS = 1400;
  var stopReturn = function(){};
  var handedOff = false;
  // The booking reference as the last pay-return answer gave it — all a token-less screen knows.
  var returnRef = null;
  // The poll budget ran out and our server still says `pending`. That is NOT "awaiting
  // confirmation": PayHere sends no notify at all for a "3ds Authentication Failed" decline (review
  // of #774), so a declined customer would wait for ever on a screen that implied it worked. Say the
  // two things we can honestly say, open the decline steps, and offer the tell-us link — on either
  // leg, because nobody knows which one a decline comes back on. Still not an outcome: no
  // `payment_failed`, no purchase.
  var NO_VERDICT = 'We haven’t heard back from your bank. If PayHere showed Declined, nothing was charged — '
    + 'you can try again below. If it showed Approved, your confirmation email is on its way.';

  function renderReturn(){
    paint('<div class="st-wrap"><div class="st-badge ok">⏳</div>'
      + '<h1 class="st-title">' + (cameFromCancel ? 'Checking where that left things…' : 'Confirming your payment…') + '</h1>'
      + '<p class="st-sub">This usually takes a few seconds.</p></div>');
    var tries = 0;
    var budget = cameFromCancel ? CANCEL_TRIES : RETURN_TRIES;
    // Which leg we came back on, for reporting ONLY — never near the code that decides an outcome.
    var leg = cameFromCancel ? 'cancel' : 'return';
    var settled = false;
    var fellBack = false;
    var lastView = null;
    var fallback = setTimeout(function(){
      if (settled || !t) return;
      fellBack = true;
      resume('Just checking your payment with the bank — nothing has been charged unless you completed it on PayHere.', DECLINE_HELP, true);
    }, FIRST_PAINT_MS);
    function stop(){ settled = true; clearTimeout(fallback); }
    stopReturn = stop;

    // Put them back on their booking with the reason they are back. A booking that is no longer
    // payable (the webhook landed meanwhile) simply renders as it now stands.
    function resume(message, help, quiet, tellUs){
      if (!t) return renderCannotResume();
      loadView().then(function(v){
        if (handedOff) return;
        lastView = v;
        if (!payable(v)) return render(v);
        render(v, message, help, quiet, tellUs);
      }).catch(function(){ renderCannotResume(); });
    }

    (function poll(){
      if (settled) return;
      tries++;
      fetch(A + '/bookings/pay-return?rt=' + encodeURIComponent(rt)).then(function(r){
        if (!r.ok) throw new Error('pay-return ' + r.status);
        return r.json();
      }).then(function(x){
        if (settled) return;
        if (x.reference) returnRef = x.reference;
        if (x.status === 'paid') {
          stop();
          if (!t) return renderPaidMinimal(x.reference);
          return loadView().then(function(v){ lastView = v; trackPurchase(v, x.sandbox); render(v); })
            .catch(function(){ renderPaidMinimal(x.reference); });
        }
        // A refusal must never read as an endless "confirming".
        if (x.status === 'failed') {
          stop();
          track('payment_failed', Object.assign(moneyOf(lastView), { leg: leg }));
          return resume('The payment didn’t go through — no charge was made. You can try again below.', DECLINE_HELP, false, true);
        }
        if (tries < budget) { setTimeout(poll, 2000); return; }
        stop();
        track(cameFromCancel ? 'payment_cancelled' : 'payment_unconfirmed', Object.assign(moneyOf(lastView), { leg: leg, tries: tries }));
        // Nothing terminal arrived. If the booking is already back on screen, retire the
        // "checking" line in place rather than re-rendering under someone about to press Pay.
        if (fellBack) {
          var e = document.getElementById('payerr');
          if (e) e.textContent = NO_VERDICT;
          var h = document.getElementById('payhelp');
          if (h && DECLINE_HELP.length) { h.innerHTML = helpHtml(DECLINE_HELP, false); h.hidden = false; }
          showTellUs();
          return;
        }
        if (t) return resume(NO_VERDICT, DECLINE_HELP, false, true);
        renderStillWaiting(x.reference);
      }).catch(function(e){
        if (settled) return;
        if (tries < budget) { setTimeout(poll, 2000); return; }
        stop();
        // Every poll failed. The customer may well have paid; we simply cannot ask.
        report('pay-return unreachable', e);
        track('payment_unconfirmed', Object.assign(moneyOf(lastView), { leg: leg, tries: tries, reason: 'unreachable' }));
        if (!fellBack) renderStillWaiting();
      });
    })();
  }

  // Paid, but this tab has no manage token to rebuild the booking from.
  function renderPaidMinimal(reference){
    paint('<div class="st-wrap"><div class="st-badge ok">&#10003;</div>'
      + '<h1 class="st-title">You’re booked.</h1>'
      + '<p class="st-sub">Payment received. Your confirmation is on its way by email.</p>'
      + (reference ? '<p class="st-sub">Booking ref <strong>' + esc(reference) + '</strong></p>' : '')
      + '</div>' + waLine());
  }

  // No answer we can act on, and no booking on screen to act from (no manage token in this tab, or
  // our server was unreachable). The same two honest readings as NO_VERDICT, with the way to retry
  // being the booking link rather than a button that isn't here.
  function renderStillWaiting(reference){
    paint('<div class="st-wrap"><div class="st-badge ok">⏳</div>'
      + '<h1 class="st-title">Still waiting to hear from your bank</h1>'
      + '<p class="st-sub">We haven’t heard back from your bank.</p>'
      + '<p class="st-sub">If PayHere showed Declined, nothing was charged — open your booking link again to retry. '
      + 'If it showed Approved, your confirmation email is on its way.</p>'
      + tellUsLink(reference) + '</div>' + waLine());
  }

  // Declined, but this tab has no manage token to rebuild the booking from (storage blocked, or a
  // different browser than the one that paid).
  function renderCannotResume(){
    paint('<div class="st-wrap"><div class="st-badge ok">!</div>'
      + '<h1 class="st-title">That payment didn’t go through</h1>'
      + '<p class="st-sub"><strong>Nothing has been charged.</strong> Open your booking link again to retry, '
      + 'or message us on WhatsApp and we’ll sort it out.</p>'
      + tellUsLink(returnRef) + '</div>' + waLine());
  }

  function loadView(){
    return fetch(A + '/bookings/view?t=' + encodeURIComponent(t)).then(function(r){
      if (!r.ok) throw new Error('view ' + r.status);
      return r.json();
    });
  }

  if (rt) { renderReturn(); return; }

  if (!t) { track('manage_link_invalid', { reason: 'no_token' }); errView('This link isn’t valid.'); return; }
  // The reminder email's main button links here with #pickup: land with the form already open.
  if (location.hash === '#pickup') cardMode = 'open';
  fetch(A + '/bookings/view?t=' + encodeURIComponent(t)).then(function(res){
    if (res.status === 401) { track('manage_link_invalid', { reason: 'unauthorised' }); throw new Error('This link isn’t valid or has changed.'); }
    if (res.status === 404) { track('manage_link_invalid', { reason: 'not_found' }); throw new Error('We couldn’t find this booking.'); }
    if (!res.ok) {
      // A 5xx here is OUR fault, not an expired link, and it used to reach nobody.
      track('manage_link_invalid', { reason: 'http_' + res.status });
      report('bookings/view failed', new Error('view ' + res.status));
      throw new Error('Something went wrong. Please try again.');
    }
    return res.json();
  }).then(function(v){
    track('manage_opened', {
      status: String(v.status || ''),
      has_balance: Number(v.balanceDueCents || 0) > 0,
      value: Math.round(Number(v.totalCents || 0)) / 100,
      currency: v.currency || 'USD',
    });
    render(v);
  }).catch(function(e){ errView(e.message); });
})();
</script>
</body>
</html>
