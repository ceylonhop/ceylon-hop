window.CEYLON_HOP_API = window.CEYLON_HOP_API || 'https://ceylon-hop-api.onrender.com';
(function(){var n=0,A=(window.CEYLON_HOP_API||'https://ceylon-hop-api.onrender.com'),P=window.CH_PROPERTY||'site';
function r(m,s){if(n>=5)return;n++;try{var b=JSON.stringify({property:P,message:String(m||'unknown').slice(0,500),stack:String(s||'').slice(0,1500),url:location.href.slice(0,300),ua:navigator.userAgent.slice(0,300)});(navigator.sendBeacon&&navigator.sendBeacon(A+'/errors/client',new Blob([b],{type:'application/json'})))||fetch(A+'/errors/client',{method:'POST',headers:{'content-type':'application/json'},body:b,keepalive:true}).catch(function(){})}catch(e){}}
// Published so the page can report HANDLED failures — a 500 on /bookings/view used to render
// as "Something went wrong. Please try again." and reach nobody.
window.chReportError=r;
window.addEventListener('error',function(e){r(e.message,e.error&&e.error.stack)});
window.addEventListener('unhandledrejection',function(e){var x=e.reason||{};r(x.message||String(x),x.stack)});})();

<!-- PayHere's JS SDK is deliberately NOT loaded (2026-09-24, docs/checkout-redirect-spec.md §1.4).
     It ran the card form and the 3-D Secure challenge inside a cross-origin iframe; two website
     payments that day were declined "3ds Authentication Failed" with no notify ever reaching us.
     This page now does the same top-level form POST to PayHere's hosted checkout that pay.html
     does, and asks our own server for the outcome on the way back. -->

<body>
<header class="pp-top"><div class="pp-topin">
  <a class="pp-brand" href="index.html">
    <img class="pp-cmark" src="img/brand-c.svg" alt="" width="32" height="32">
    <span class="pp-word">Ceylon Hop</span>
  </a>
  <span class="pp-wa"><a href="https://wa.me/94779669662">WhatsApp us</a></span>
</div></header>
<div class="pp-wrap"><div id="app" class="tk-sk" aria-busy="true" aria-label="Loading your booking">
  <i class="sk-hello"></i><i class="sk-title"></i><i class="sk-sub"></i>
  <div class="ticket"><div class="t-main">
    <div class="t-head"><i class="sk-ref"></i><i class="sk-stat"></i></div>
    <div class="fact"><i class="sk-k"></i><i class="sk-v"></i></div>
    <div class="fact"><i class="sk-k"></i><i class="sk-v"></i></div>
    <div class="fact"><i class="sk-k"></i><i class="sk-v"></i></div>
  </div>
  <div class="perf"></div>
  <div class="t-stub"><div class="tot"><i class="sk-tot-l"></i><i class="sk-tot-v"></i></div></div></div>
</div></div>

<script>
(function(){
  'use strict';
  // "Your booking" — the page a customer reaches from a confirmation email or from the ops
  // booking drawer's payment link. It is the SAME travel document as pay.html (ticket.css):
  // a customer following either link should not be able to tell they landed on a different
  // system. Everything here is derived from the booking; nothing is typed on this page.
  var app = document.getElementById('app');
  // The ?t= link token authorises viewing this booking AND minting a checkout token for it.
  // Left in the address bar it flows into GA4's page_location, Clarity's recording and this
  // page's own error beacon (which posts location.href), so anyone with analytics access could
  // open a customer's booking and start its payment flow. Read it once, hand it to
  // sessionStorage, and take it out of the URL.
  //
  // sessionStorage is what keeps reload working after the strip — and it can throw (private
  // mode, storage disabled). If it does, we DON'T strip: a token in the URL is a privacy
  // problem, but a customer who cannot reload their own booking is a broken page. Function
  // first, privacy wherever it is free.
  var TOKEN_KEY = 'chManageToken';
  var q = new URLSearchParams(location.search);
  var t = q.get('t');
  // Set only on the leg BACK from PayHere (the server builds that address — see returnTo below).
  // `rt` is a status-only token for /bookings/pay-return; `c=1` means the gateway used cancel_url,
  // a display hint and NEVER an outcome. Both are read once and taken out of the address bar with
  // `t`, so a reload after the return simply shows the booking as it now stands.
  var rt = q.get('rt');
  var cameFromCancel = q.get('c') === '1';
  var strip = [];
  if (rt !== null) strip.push('rt');
  if (q.has('c')) strip.push('c');
  if (t) {
    var stashed = false;
    try { sessionStorage.setItem(TOKEN_KEY, t); stashed = true; } catch (e) {}
    if (stashed) strip.push('t');
  } else {
    try { t = sessionStorage.getItem(TOKEN_KEY); } catch (e) {}
  }
  if (strip.length) {
    try {
      var url = new URL(location.href);
      strip.forEach(function(k){ url.searchParams.delete(k); });
      history.replaceState(null, '', url.pathname + url.search + url.hash);
    } catch (e) {}
  }
  var A = (window.CEYLON_HOP_API || '').replace(/\/$/, '');

  function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}
  function waLine(){return '<div class="pp-note">Questions? <a href="https://wa.me/94779669662">WhatsApp us</a> — our team replies during Sri Lanka service hours.</div>';}

  // Clarity masks form INPUTS by default, not rendered text — and the greeting carries the
  // customer's first name. The booking reference stays legible on purpose: it is the join key
  // back to the booking, and a replay you cannot tie to an order answers nothing.
  var MASK = ' data-clarity-mask="true"';

  // ── funnel + failure reporting (2026-08-07) ─────────────────────────────────────────
  // The booking-management page pushed nothing, so a customer coming back to pay a balance
  // was invisible until the money either arrived or didn't. Guarded; no PII ever.
  function track(event, params){
    if (typeof window.chTrack === 'function') window.chTrack(event, params || {});
  }
  function report(what, err){
    var x = err || {};
    if (typeof window.chReportError === 'function') {
      window.chReportError('[manage] ' + what + (x.message ? ' — ' + x.message : ''), x.stack);
    }
  }
  // Same gates as pay.html: `purchase` becomes revenue and GA4 cannot take it back, so a
  // sandbox checkout must never reach it. The return leg never sees the checkout URL, so WHICH
  // gateway we handed off to is recorded at hand-off time; and it fires once per booking whatever
  // the customer does with the back button.
  var STORE = 'ch_manage_pay_v1';
  function markSandbox(isSandbox){
    try { sessionStorage.setItem(STORE + ':sandbox', isSandbox ? '1' : '0'); } catch (e) {}
  }
  function sandboxUsed(){
    try { return sessionStorage.getItem(STORE + ':sandbox') === '1'; } catch (e) { return false; }
  }
  function trackPurchase(v){
    if (sandboxUsed()) return;
    if (typeof window.chIsProd !== 'function' || !window.chIsProd()) return;
    var seen = STORE + ':purchased';
    try {
      if (sessionStorage.getItem(seen) === String(v.reference || '1')) return;
      sessionStorage.setItem(seen, String(v.reference || '1'));
    } catch (e) { /* private mode — better a possible double than a missing purchase */ }
    track('purchase', {
      transaction_id: String(v.reference || ''),
      value: Math.round(Number(v.amountDueNowCents || 0)) / 100,
      currency: v.currency || 'USD',
    });
  }
  function moneyOf(v){
    return { value: Math.round(Number(v && v.amountDueNowCents || 0)) / 100, currency: (v && v.currency) || 'USD' };
  }

  // Money the way the pay page shows it: USD gets its symbol and both decimals, so $229.00
  // reads as a price rather than a value out of a database.
  function money(cents, cur){
    var n = (Number(cents || 0) / 100).toFixed(2);
    return (cur || 'USD') === 'USD' ? '$' + n : (cur + ' ' + n);
  }

  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  // '2026-07-22' → 'Wednesday 22 July 2026'. Built from UTC parts, never new Date(string),
  // which lands on the previous day for anyone west of Greenwich.
  function longDate(iso){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
    if (!m) return iso ? String(iso) : '';
    var d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
    return DAYS[d.getUTCDay()] + ' ' + (+m[3]) + ' ' + MONTHS[+m[2] - 1] + ' ' + m[1];
  }
  var MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function isoParts(iso){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || '')); return m ? { y:+m[1], mo:+m[2], d:+m[3] } : null; }
  // '22 Jul' — the stamp beside each leg on the rail.
  function stamp(iso){ var p = isoParts(iso); return p ? p.d + ' ' + MON3[p.mo - 1] : ''; }
  // '22–26 July 2026', or '30 July – 3 August 2026' across a month boundary.
  function rangeLabel(a, b){
    var x = isoParts(a), y = isoParts(b);
    if (!x || !y) return '';
    if (x.y === y.y && x.mo === y.mo) return x.d + '\u2013' + y.d + ' ' + MONTHS[x.mo - 1] + ' ' + x.y;
    return x.d + ' ' + MONTHS[x.mo - 1] + ' \u2013 ' + y.d + ' ' + MONTHS[y.mo - 1] + ' ' + y.y;
  }
  var NUMWORD = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
  function countWord(n){ return NUMWORD[n] || String(n); }
  // A journey is a LEG — the hop between two stops — so four stops is three journeys.
  function legsOf(v){
    var stops = (v && v.stops && v.stops.length >= 2) ? v.stops : [v.from, v.to];
    var dates = (v && v.legDates) || [];
    var out = [];
    for (var i = 0; i < stops.length - 1; i++) out.push({ route: stops[i] + ' \u2192 ' + stops[i + 1], date: dates[i] || null });
    return out;
  }

  function vehicleLabel(v){
    if (!v) return 'To be confirmed';
    if (/van/i.test(v)) return 'Van';
    if (/car/i.test(v)) return 'Private car';
    return String(v).charAt(0).toUpperCase() + String(v).slice(1);
  }
  // The booking's status is a DATABASE enum. A traveller gets told what it means for them —
  // never "payment_pending", which is what this page used to print at them.
  function statusChip(status){
    var s = {
      draft:            ['wait', 'Awaiting payment'],
      payment_pending:  ['wait', 'Awaiting payment'],
      paid:             ['ok',   'Confirmed'],
      confirmed:        ['ok',   'Confirmed'],
      completed:        ['ok',   'Completed'],
      cancelled:        ['off',  'Cancelled'],
      refunded:         ['off',  'Refunded']
    }[status];
    return s ? '<span class="t-stat ' + s[0] + '">' + s[1] + '</span>' : '';
  }

  // Every path that replaces the first-paint skeleton goes through here. Clearing aria-busy
  // matters as much as clearing the class: a screen reader announcing "busy" over a booking
  // that is already on screen is worse than never announcing it.
  function paint(html){
    app.innerHTML = html;
    app.classList.remove('tk-sk');
    app.removeAttribute('aria-busy');
    app.removeAttribute('aria-label');
  }

  function errView(msg){
    paint('<div class="st-wrap"><div class="st-badge warn">!</div>'
      + '<h1 class="st-title">We couldn’t open this booking</h1>'
      + '<p class="st-sub">' + esc(msg) + '</p></div>' + waLine());
  }

  // A booking can only be charged while it is genuinely open and something is owed. Offering
  // payment on a settled booking is how somebody pays twice; the backend refuses it too.
  function payable(v){ return (v.status === 'draft' || v.status === 'payment_pending') && v.amountDueNowCents > 0; }

  // The title has to survive a four-stop tour. "first → last" reads exactly like a direct
  // transfer and hides the middle, so a real trip leads with what it IS — how many journeys, over
  // which dates — and the rail underneath names every hop.
  function titleOf(v){
    var legs = legsOf(v);
    if (legs.length <= 1) return v.from + ' → ' + v.to;
    var range = rangeLabel(v.date, v.endDate);
    var word = countWord(legs.length);
    return word.charAt(0).toUpperCase() + word.slice(1) + ' journeys' + (range ? ', ' + range : '');
  }
  function subtitleOf(v){
    var legs = legsOf(v);
    if (legs.length <= 1) return longDate(v.date) || 'Date to be confirmed';
    return v.from + ' → ' + v.to;
  }
  function factsOf(v){
    var legs = legsOf(v);
    var stopCount = legs.length + 1;
    // A one-day trip genuinely starts and ends on the same date; say so rather than printing
    // the same line twice with no explanation.
    var sameDay = v.date && v.endDate && v.date === v.endDate;
    var rows = [
      { k: 'Trip start', v: longDate(v.date) || 'To be confirmed' },
      { k: 'Trip end', v: longDate(v.endDate) || 'To be confirmed', sub: sameDay ? 'same day' : '' },
      { k: 'Pick-up time', v: (v.time && v.time !== 'to confirm') ? v.time : 'To be confirmed' },
      // Asked for on every card, not just the multi-stop ones: "2 stops" on a direct transfer
      // still answers "is there anything else on this trip?".
      { k: 'Stops', v: stopCount + ' stops', sub: legs.length <= 1 ? 'direct' : '' },
      { k: 'Travellers', v: String(v.travellers) },
      { k: 'Vehicle', v: vehicleLabel(v.vehicleType) },
    ];
    return rows.map(function(r){
      return '<div class="fact"><span class="k">' + esc(r.k) + '</span><span class="v">' + esc(r.v)
        + (r.sub ? '<small>' + esc(r.sub) + '</small>' : '') + '</span></div>';
    }).join('');
  }

  // Shared with pay.html and booking.html — see decline-help.js for why this copy says what it says.
  var DECLINE_HELP = window.CH_DECLINE_HELP || [];
  // `quiet` collapses the steps behind a summary: available, not asserted — for a return with no
  // verdict, where most people simply changed their mind (pay.html's fail() explains the case).
  function helpHtml(help, quiet){
    if (!help || !help.length) return '';
    var steps = '<ol>' + help.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>';
    return quiet
      ? '<details class="pp-quiet"><summary>Card refused? Here’s what usually fixes it</summary>' + steps + '</details>'
      : '<h3>If your card was declined</h3>' + steps;
  }

  // The one-tap "tell us what happened" link booking.html's payment overlay carries (#766): the
  // only source that can say what a customer saw at the gateway is the customer, and a message
  // that already names the booking saves them finding the reference. Since the website checkout
  // became a redirect (2026-09-24) a failed payment is answered HERE, so the link is shown on the
  // two states that mean it didn't work — a decline and the cancel leg — and nowhere else.
  function waTellUsHref(v){
    return 'https://wa.me/94779669662?text=' + encodeURIComponent(
      'Hi Ceylon Hop, my payment' + (v && v.reference ? ' for booking ' + v.reference : '') + ' didn\'t go through. What I saw: ');
  }
  function showTellUs(){
    var a = document.getElementById('paywa');
    if (a) a.hidden = false;
  }

  function render(v, errMsg, help, quiet, tellUs){
    var due = Number(v.balanceDueCents || 0);
    var html =
      '<div class="pp-hello"' + (v.firstName ? MASK : '') + '>' + (v.firstName ? 'Hi ' + esc(v.firstName) + ',' : 'Your booking') + '</div>'
      + '<h1 class="pp-title">' + esc(titleOf(v)) + '</h1>'
      + '<p class="pp-sub">' + esc(subtitleOf(v)) + '</p>'
      + '<div class="ticket"><div class="t-main">'
      + '<div class="t-head"><span class="t-ref">Booking ' + esc(v.reference) + '</span>'
      + statusChip(v.status) + '</div>'
      // A trip with stops in the middle shows every journey; a direct transfer has nothing to
      // add beyond its title, so it skips the rail rather than drawing a rail of one.
      + (legsOf(v).length > 1 ? '<div class="hops">' + legsOf(v).map(function(l, i, all){
          var last = i === all.length - 1;
          return '<div class="hop"><div class="hop-rail"><span class="hop-dot' + (last ? ' end' : '') + '"></span>'
            + (last ? '' : '<span class="hop-line"></span>') + '</div>'
            + '<div><div class="hop-t">' + esc(l.route) + '</div>'
            + '<div class="hop-d">' + (l.date ? esc(stamp(l.date)) : 'date to be confirmed') + '</div></div></div>';
        }).join('') + '</div>' : '')
      + factsOf(v)
      + '</div><div class="perf"></div><div class="t-stub">'
      + '<div class="tot"><span class="l">Total</span><span class="v">' + esc(money(v.totalCents, v.currency)) + '</span></div>'
      // A zero balance is not news — it earns a row only when something is left to pay.
      + (due > 0 ? '<div class="tot due"><span class="l">Balance due</span><span class="v">' + esc(money(due, v.currency)) + '</span></div>' : '');

    if (payable(v)) {
      html += '<button class="btn btn-cta pp-cta" id="paybtn">Pay with PayHere</button>'
        + '<div class="paysub">Pay securely to confirm. ' + esc(money(v.amountDueNowCents, v.currency)) + ' — no extra fees.</div>'
        + '<div class="badges"><span class="card-badge"><span class="visa">VISA</span></span>'
        + '<span class="card-badge">MASTERCARD</span><span class="card-badge">AMEX</span></div>'
        + '<p class="pp-err" id="payerr"' + (errMsg ? '' : ' hidden') + '>' + esc(errMsg || '') + '</p>'
        // Only after a real attempt at the gateway — see helpHtml().
        + '<div class="pp-help" id="payhelp"' + (help && help.length ? '' : ' hidden') + '>' + helpHtml(help, quiet) + '</div>'
        + '<a class="btn btn-ghost pp-cta pp-tellus" id="paywa" href="' + esc(waTellUsHref(v)) + '" target="_blank" rel="noopener"'
        + (tellUs ? '' : ' hidden') + '>Tell us what happened on WhatsApp</a>';
    }
    html += '</div></div>' + waLine();
    paint(html);
    var btn = document.getElementById('paybtn');
    if (btn) btn.addEventListener('click', function(){
      track('begin_checkout', {
        value: Math.round(Number(v.amountDueNowCents || 0)) / 100,
        currency: v.currency || 'USD',
      });
      pay(v);
    });
  }

  // Shown between the press and the browser leaving for payhere.lk. It no longer says "don't
  // close this page": the customer is being sent TO PayHere, not shown a window on top of us.
  function renderLoading(v){
    paint('<div class="pp-loading"><div class="pp-spin"></div>'
      + '<h2>Taking you to PayHere…</h2>'
      + '<p>You’ll finish paying on PayHere’s own secure page, then come straight back here. We never see your card details.</p>'
      + '<div class="amt">' + esc(money(v.amountDueNowCents, v.currency)) + '</div>'
      + '<p>🔒 PayHere · Sri Lanka’s Central Bank-approved gateway</p>'
      // Owner-observed on the live gateway (2026-08-05, pay.html): PayHere parks the payer on
      // "Payment Approved"/"Declined" behind a manual "Back to Site" link rather than redirecting.
      + '<p>When PayHere is done, tap <strong>Back to Site</strong> to see your booking.</p></div>');
  }

  function pay(v){
    // A return-leg poll still running underneath must not repaint over the hand-off.
    handedOff = true;
    stopReturn();
    renderLoading(v);
    // A failure rebuilds the whole booking view with the error named on it — never a dead
    // screen, and never a button whose label has quietly become the error.
    function fail(msg){ render(v, msg); }
    // The link token authorises a checkout token, which authorises the charge. The booking
    // id comes back with it — the view projection withholds it on purpose.
    fetch(A + '/bookings/view/checkout-token', { method: 'POST', headers: { authorization: 'Bearer ' + t } })
      .then(function(r){
        return r.ok ? r.json() : r.json().catch(function(){ return {}; }).then(function(x){
          throw new Error(x.error === 'not_chargeable'
            ? 'This booking has already been paid or closed.'
            : 'We couldn’t start your payment just now.');
        });
      })
      .then(function(x){
        // `returnTo` states INTENT, never a URL: the server builds the return address (back to
        // this page, on the manage link's own origin) from its own config — a gateway that
        // redirects wherever the request body says is a phishing primitive.
        return fetch(A + '/bookings/' + x.bookingId + '/checkout', {
          method: 'POST',
          headers: { authorization: 'Bearer ' + x.checkoutToken, 'content-type': 'application/json' },
          body: JSON.stringify({ returnTo: 'manage' }),
        })
          .then(function(r){ if (!r.ok) throw new Error('We couldn’t start your payment just now — no charge was made.'); return r.json(); });
      })
      .then(function(checkout){
        if (!checkout || !checkout.checkoutUrl) throw new Error('We couldn’t start your payment just now — no charge was made.');
        // Anything that isn't real PayHere is the dev/fake gateway: send the browser to
        // whatever it returned rather than pretending on this page that money moved.
        if (!/payhere\.lk/.test(checkout.checkoutUrl)) { location.href = checkout.checkoutUrl; return; }
        if (!checkout.fields) throw new Error('We couldn’t start your payment just now — no charge was made.');
        // Record WHICH gateway we are handing off to — the return leg never sees the URL, and a
        // sandbox settlement reported as revenue is permanent in GA4.
        markSandbox(/sandbox\.payhere\.lk/.test(checkout.checkoutUrl));
        // The last thing we know for certain: they left for the gateway. Everything after this
        // is what our own server tells us on the way back.
        track('payment_initiated', moneyOf(v));
        // A TOP-LEVEL form POST, exactly as pay.html does it. The fields are the server's
        // verbatim: `hash` covers merchant_id + order_id + amount + currency and is signed server
        // side, so reordering, renaming or adding anything here would be refused by the gateway.
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = checkout.checkoutUrl;
        Object.keys(checkout.fields).forEach(function(k){
          var input = document.createElement('input');
          input.type = 'hidden';
          input.name = k;
          input.value = checkout.fields[k];
          form.appendChild(input);
        });
        document.body.appendChild(form);
        form.submit();
      })
      .catch(function(e){
        track('payment_start_failed', { reason: String((e && e.message) || 'unknown').slice(0, 60) });
        report('checkout start failed', e);
        fail(e.message);
      });
  }

  // ── the return leg ──────────────────────────────────────────────────────────────────────
  // pay.html's renderReturn(), for this page. PayHere passes NO payment status back on the
  // redirect, so nothing in the URL is read as an outcome: we poll our own server, which the
  // webhook owns. Both legs poll identically — PayHere does not document where a DECLINE lands,
  // and parks every payer behind "Back to Site" — `c=1` only shortens the wait and the words.
  var RETURN_TRIES = 30;
  var CANCEL_TRIES = 8;
  // After this long the booking (and its Pay button) comes back and checking continues
  // underneath, upgrading the moment an answer arrives — owner-reported on pay.html: a spinner
  // held far too long before showing anything useful.
  var FIRST_PAINT_MS = 1400;
  var stopReturn = function(){};
  var handedOff = false;

  function renderReturn(){
    paint('<div class="st-wrap"><div class="st-badge ok">⏳</div>'
      + '<h1 class="st-title">' + (cameFromCancel ? 'Checking where that left things…' : 'Confirming your payment…') + '</h1>'
      + '<p class="st-sub">This usually takes a few seconds.</p></div>');
    var tries = 0;
    var budget = cameFromCancel ? CANCEL_TRIES : RETURN_TRIES;
    // Which leg we came back on, for reporting ONLY — never near the code that decides an outcome.
    var leg = cameFromCancel ? 'cancel' : 'return';
    var settled = false;
    var fellBack = false;
    var lastView = null;
    var fallback = setTimeout(function(){
      if (settled || !t) return;
      fellBack = true;
      resume('Just checking your payment with the bank — nothing has been charged unless you completed it on PayHere.', DECLINE_HELP, true);
    }, FIRST_PAINT_MS);
    function stop(){ settled = true; clearTimeout(fallback); }
    stopReturn = stop;

    // Put them back on their booking with the reason they are back. A booking that is no longer
    // payable (the webhook landed meanwhile) simply renders as it now stands.
    function resume(message, help, quiet, tellUs){
      if (!t) return renderCannotResume();
      loadView().then(function(v){
        if (handedOff) return;
        lastView = v;
        if (!payable(v)) return render(v);
        render(v, message, help, quiet, tellUs);
      }).catch(function(){ renderCannotResume(); });
    }

    (function poll(){
      if (settled) return;
      tries++;
      fetch(A + '/bookings/pay-return?rt=' + encodeURIComponent(rt)).then(function(r){
        if (!r.ok) throw new Error('pay-return ' + r.status);
        return r.json();
      }).then(function(x){
        if (settled) return;
        if (x.status === 'paid') {
          stop();
          if (!t) return renderPaidMinimal(x.reference);
          return loadView().then(function(v){ lastView = v; trackPurchase(v); render(v); })
            .catch(function(){ renderPaidMinimal(x.reference); });
        }
        // A refusal must never read as an endless "confirming".
        if (x.status === 'failed') {
          stop();
          track('payment_failed', Object.assign(moneyOf(lastView), { leg: leg }));
          return resume('The payment didn’t go through — no charge was made. You can try again below.', DECLINE_HELP, false, true);
        }
        if (tries < budget) { setTimeout(poll, 2000); return; }
        stop();
        track(cameFromCancel ? 'payment_cancelled' : 'payment_unconfirmed', Object.assign(moneyOf(lastView), { leg: leg, tries: tries }));
        // Nothing terminal arrived. If the booking is already back on screen, retire the
        // "checking" line in place rather than re-rendering under someone about to press Pay.
        if (fellBack) {
          var e = document.getElementById('payerr');
          if (e) {
            e.textContent = cameFromCancel
              ? 'You came back without finishing the payment — nothing was charged.'
              : 'We haven’t had confirmation yet — nothing was charged unless you completed the payment. We’ll email you if it lands.';
          }
          if (cameFromCancel) showTellUs();
          return;
        }
        if (cameFromCancel) return resume('You came back without finishing the payment — nothing was charged.', DECLINE_HELP, true, true);
        renderStillWaiting();
      }).catch(function(e){
        if (settled) return;
        if (tries < budget) { setTimeout(poll, 2000); return; }
        stop();
        // Every poll failed. The customer may well have paid; we simply cannot ask.
        report('pay-return unreachable', e);
        track('payment_unconfirmed', Object.assign(moneyOf(lastView), { leg: leg, tries: tries, reason: 'unreachable' }));
        if (!fellBack) renderStillWaiting();
      });
    })();
  }

  // Paid, but this tab has no manage token to rebuild the booking from.
  function renderPaidMinimal(reference){
    paint('<div class="st-wrap"><div class="st-badge ok">&#10003;</div>'
      + '<h1 class="st-title">You’re booked.</h1>'
      + '<p class="st-sub">Payment received. Your confirmation is on its way by email.</p>'
      + (reference ? '<p class="st-sub">Booking ref <strong>' + esc(reference) + '</strong></p>' : '')
      + '</div>' + waLine());
  }

  function renderStillWaiting(){
    paint('<div class="st-wrap"><div class="st-badge ok">⏳</div>'
      + '<h1 class="st-title">Payment received?</h1>'
      + '<p class="st-sub">Confirmation is taking longer than usual. Your bank may still be processing — '
      + 'we’ll email you the moment it lands, or just WhatsApp us.</p></div>' + waLine());
  }

  function renderCannotResume(){
    paint('<div class="st-wrap"><div class="st-badge ok">!</div>'
      + '<h1 class="st-title">That payment didn’t go through</h1>'
      + '<p class="st-sub"><strong>Nothing has been charged.</strong> Open your booking link again to retry, '
      + 'or message us on WhatsApp and we’ll sort it out.</p></div>' + waLine());
  }

  function loadView(){
    return fetch(A + '/bookings/view?t=' + encodeURIComponent(t)).then(function(r){
      if (!r.ok) throw new Error('view ' + r.status);
      return r.json();
    });
  }

  if (rt) { renderReturn(); return; }

  if (!t) { track('manage_link_invalid', { reason: 'no_token' }); errView('This link isn’t valid.'); return; }
  fetch(A + '/bookings/view?t=' + encodeURIComponent(t)).then(function(res){
    if (res.status === 401) { track('manage_link_invalid', { reason: 'unauthorised' }); throw new Error('This link isn’t valid or has changed.'); }
    if (res.status === 404) { track('manage_link_invalid', { reason: 'not_found' }); throw new Error('We couldn’t find this booking.'); }
    if (!res.ok) {
      // A 5xx here is OUR fault, not an expired link, and it used to reach nobody.
      track('manage_link_invalid', { reason: 'http_' + res.status });
      report('bookings/view failed', new Error('view ' + res.status));
      throw new Error('Something went wrong. Please try again.');
    }
    return res.json();
  }).then(function(v){
    track('manage_opened', {
      status: String(v.status || ''),
      has_balance: Number(v.balanceDueCents || 0) > 0,
      value: Math.round(Number(v.totalCents || 0)) / 100,
      currency: v.currency || 'USD',
    });
    render(v);
  }).catch(function(e){ errView(e.message); });
})();
</script>
</body>
</html>
