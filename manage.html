<style>
  /* On the brand design system — site.css supplies the body font (--body) + tokens. */
  .mg-top{border-bottom:1px solid var(--line);background:var(--paper)}
  .mg-brand{display:block;max-width:640px;margin:0 auto;padding:16px 18px;font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--accent-deep);text-decoration:none;letter-spacing:-.01em}
  .mg-wrap{max-width:640px;margin:0 auto;padding:28px 18px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-top:16px;box-shadow:var(--shadow-s)}
  .row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--cream-deep)}
  .row:last-child{border-bottom:0}

  .pay-btn{display:inline-block;width:100%;border:0;background:var(--accent-deep);color:#fff;font:inherit;font-weight:700;padding:14px 26px;border-radius:11px;cursor:pointer}

<body>
<header class="mg-top"><a href="index.html" class="mg-brand">Ceylon Hop</a></header>
<div class="mg-wrap"><div id="app"><p class="muted">Loading your booking…</p></div></div>
<footer class="mg-foot"><a href="https://wa.me/94779669662">WhatsApp us</a> &middot; <a href="index.html">ceylonhop.com</a></footer>
<script src="https://www.payhere.lk/lib/payhere.js"></script>
<script>
(function(){
  var app = document.getElementById('app');
  var t = new URLSearchParams(location.search).get('t');
  var A = window.CEYLON_HOP_API.replace(/\/$/, '');
  function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}
  function money(cents,cur){return (cur||'USD')+' '+ (cents/100).toFixed(2).replace(/\.00$/,'');}
  function errView(msg){app.innerHTML='<div class="err"><h2>We couldn’t open this booking</h2><p class="muted">'+esc(msg)+'</p><p><a href="https://wa.me/94779669662">Message us on WhatsApp</a> and we’ll pull it up for you.</p></div>';}
  if(!t){ errView('This link isn’t valid.'); return; }
  fetch(A+'/bookings/view?t='+encodeURIComponent(t)).then(function(res){
    if(res.status===401) throw new Error('This link isn’t valid or has changed.');
    if(res.status===404) throw new Error('We couldn’t find this booking.');
    if(!res.ok) throw new Error('Something went wrong. Please try again.');
    return res.json();
  }).then(function(v){
    var rows = [
      ['Route', esc(v.from)+' → '+esc(v.to)],
      ['Date', esc(v.date)], ['Pick-up time', esc(v.time)],
      ['Travellers', esc(v.travellers)],
      ['Vehicle', v.vehicleType?esc(v.vehicleType):'—'],
      ['Total', money(v.totalCents,v.currency)],
      ['Balance due', money(v.balanceDueCents,v.currency)],
    ].map(function(x){return '<div class="row"><span class="muted">'+x[0]+'</span><span>'+x[1]+'</span></div>';}).join('');
    app.innerHTML = '<p class="muted">Hi '+esc(v.firstName)+', here’s your booking.</p>'
      + '<div class="card"><div class="ref">'+esc(v.reference)+'</div>'
      + '<p class="muted">Status: '+esc(v.status)+'</p>'+rows+'</div>'
      + payBlock(v);
    wirePay(v);
  }).catch(function(e){ errView(e.message); });

  /* ── Pay by card ──────────────────────────────────────────────────────────────────────
     This page used to be read-only, which made every "here's your payment link" promise a
     dead end: an ops-booked trip has no other way to reach a card form. The button only
     appears while the booking can genuinely be charged — the backend refuses anything else,
     and offering a payment on a booking that is already paid is how someone pays twice. */
  function payable(v){ return (v.status==='draft'||v.status==='payment_pending')&&v.amountDueNowCents>0; }

  function payBlock(v){
    if(!payable(v)) return '';
    return '<div class="pay">'
      + '<button class="pay-btn" id="pay">Pay '+money(v.amountDueNowCents,v.currency)+' now</button>'
      + '<p class="pay-note">🔒 Card payments are processed by PayHere, Sri Lanka’s Central Bank-approved gateway.</p>'
      + '<p class="pay-err" id="payerr" hidden></p></div>';
  }

  function wirePay(v){
    var btn = document.getElementById('pay');
    if(!btn) return;
    var err = document.getElementById('payerr');
    function fail(msg){ err.textContent = msg; err.hidden = false; btn.disabled = false; btn.textContent = 'Try again'; }
    btn.addEventListener('click', function(){
      btn.disabled = true; btn.textContent = 'Opening secure payment…'; err.hidden = true;
      // The link token authorises a checkout token, which authorises the charge. The booking
      // id comes back with it — the view projection withholds it on purpose.
      fetch(A+'/bookings/view/checkout-token',{method:'POST',headers:{authorization:'Bearer '+t}})
        .then(function(r){ return r.ok ? r.json() : r.json().catch(function(){return {};}).then(function(x){ throw new Error(x.error==='not_chargeable' ? 'This booking has already been paid or closed.' : 'We couldn’t start your payment just now.'); }); })
        .then(function(x){
          return fetch(A+'/bookings/'+x.bookingId+'/checkout',{method:'POST',headers:{authorization:'Bearer '+x.checkoutToken}})
            .then(function(r){ if(!r.ok) throw new Error('We couldn’t start your payment just now — no charge was made.'); return r.json(); });
        })
        .then(function(checkout){
          if(!checkout||!checkout.checkoutUrl) throw new Error('We couldn’t start your payment just now — no charge was made.');
          // Anything that isn't real PayHere is the dev/fake gateway: send the browser to
          // whatever it returned rather than pretending on this page that money moved.
          if(!/payhere\.lk/.test(checkout.checkoutUrl)){ location.href = checkout.checkoutUrl; return; }
          if(!window.payhere) throw new Error('We couldn’t open the secure payment window — please turn off any ad-blocker for this page and try again. No charge was made.');
          payhere.onCompleted = function(){ location.reload(); };   // the webhook is the source of truth
          payhere.onDismissed = function(){ btn.disabled = false; btn.textContent = 'Pay '+money(v.amountDueNowCents,v.currency)+' now'; };
          payhere.onError = function(){ fail('The payment didn’t go through. No charge was made.'); };
          payhere.startPayment(Object.assign({ sandbox: /sandbox\.payhere\.lk/.test(checkout.checkoutUrl) }, checkout.fields));
        })
        .catch(function(e){ fail(e.message); });
    });
  }
})();
</script>
