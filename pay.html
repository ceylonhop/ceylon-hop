<!-- PayHere's JS SDK is deliberately NOT loaded (2026-08-05, docs/checkout-redirect-spec.md).
     It rendered the card form and the 3-D Secure challenge inside a cross-origin iframe, where a
     failure reaches none of its callbacks — our page could not even tell it had happened, which is
     exactly how CH-XKZL3 sat on a spinner. This page now does the top-level form POST that PayHere
     documents as the primary Checkout API integration. Nothing here should re-add that script. -->
<style>
  /* pay.html-only. The shared travel-document design lives in ticket.css, which BOTH
     customer pages load — see the note at the top of that file. */

  /* the multi-leg rail now lives in ticket.css — shared with manage.html */

  /* A negotiated price: two quiet rows, then the figure that is actually paid. Same treatment
     quote.css gives the same three rows — a customer who saw the breakdown on their quote link
     should meet the identical shape here. .tot .v carries font-size:2rem in ticket.css, so the
     size MUST be overridden on .v itself and not on the row; .tot.due .v is the precedent.
     Copied rather than shared because this page does not load quote.css. */
  .tot.tot-sub{margin-top:7px}
  .tot.tot-sub .v{font-size:1.05rem;font-weight:600;color:var(--ink-faint)}
  .tot.tot-disc .v{color:var(--accent-deep)}
  .tot.tot-final{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft,#f0ece1)}

  /* Follow-along footer. Copied from quote.css, which this page does not load. Deliberately
     quiet — muted until hover: the page's job is the red CTA, and a louder row competes with
     it for the same glance. */
  .pp-social{display:flex;align-items:center;justify-content:center;gap:14px;padding:22px 18px 34px;color:var(--ink-faint)}
  .pp-social span{font-size:.78rem;letter-spacing:.02em}
  .pp-social a{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);color:var(--ink-soft);background:var(--paper);transition:color .15s,border-color .15s}
  .pp-social a:hover{color:var(--accent-deep);border-color:var(--accent)}
  .pp-social svg{width:17px;height:17px}

  /* details step */
  .dt-h{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0 0 2px}
  .dt-sub{font-size:.8rem;color:var(--ink-soft);margin:0 0 12px}
  .fld{margin-bottom:10px}
  .fld label{display:block;font-size:.65rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px}
  .fld input,.fld select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;font:inherit;font-size:.9rem;color:var(--ink)}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.12)}
  /* billing block (2026-08-01) */
  .dt-kick{font-size:.66rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--accent-deep);margin:2px 0 8px}
  .dt-kick:not(:first-child){margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .dt-kick span{color:var(--ink-faint);font-weight:600;letter-spacing:0;text-transform:none}
  .dt-chk{display:flex;gap:8px;align-items:flex-start;padding:0 2px 10px;cursor:pointer;font-size:.82rem;color:var(--ink)}
  .dt-chk input{width:16px;height:16px;margin-top:2px;accent-color:var(--accent-deep);flex:none;cursor:pointer}
  .dt-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dt-2col[hidden]{display:none}
  /* a grid child's default min-width:auto lets a long <option> ("United Arab Emirates +971")
     push the column wider than its share — pin it so the select truncates instead. */
  .dt-2col>.fld{min-width:0}
  /* dial code + number read as one field, so they share a row (2026-08-02). */
  .dt-phone{grid-template-columns:1.15fr 1fr}
  /* "optional" rides in the label so the field reads as skippable at a glance — a postcode
     the payer cannot supply must never look like a blocker (2026-08-02). */
  .fld label span{float:right;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink-faint);opacity:.8}
  /* What to actually DO about a decline (2026-08-02). A card refused by the issuer used to
     leave the payer with one line — "the payment didn't go through" — and no next step, on a
     page they had already decided to pay on. Most of these declines are a foreign-transaction
     block the cardholder can clear themselves in under a minute, so the steps are worth the
     space. Rendered only after a real attempt, never on the first paint. */
  .pp-help{margin:10px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--wash,#faf8f5)}
  .pp-help[hidden]{display:none}
  .pp-help h3{margin:0 0 8px;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-deep)}
  .pp-help ol{margin:0;padding-left:18px;font-size:.82rem;line-height:1.55;color:var(--ink)}
  .pp-help li+li{margin-top:6px}
  /* Available, not asserted — see the `quiet` note on fail(). Same affordance as the cancellation
     policy below it, so the page has one way of saying "there is more here if you want it". */
  .pp-quiet summary{font-size:.8rem;font-weight:700;color:var(--accent-deep);cursor:pointer;list-style:none}
  .pp-quiet summary::-webkit-details-marker{display:none}
  .pp-quiet summary:after{content:' \25BE'}
  .pp-quiet[open] summary:after{content:' \25B4'}
  .pp-quiet ol{margin-top:9px}
  .dt-terms{padding-top:12px;margin-top:2px;border-top:1px solid var(--line);align-items:flex-start}
  .dt-terms a{color:var(--accent-deep);font-weight:700}
  .dt-terms b{display:block;font-weight:600;font-size:.78rem;color:var(--ink-soft);margin-top:2px}
  .dt-pol{margin:2px 2px 4px}
  .dt-pol summary{font-size:.75rem;color:var(--accent-deep);font-weight:700;cursor:pointer;list-style:none}
  .dt-pol summary::-webkit-details-marker{display:none}
  .dt-pol summary:after{content:' \25BE'}
  .dt-pol[open] summary:after{content:' \25B4'}
  .dt-pol ul{margin:6px 0 0;padding-left:17px;font-size:.76rem;line-height:1.7;color:var(--ink-soft)}
  /* On the payable screen the policy is reassurance under the CTA, not the clause beside a
     checkbox — so it sits centred and quiet, and only the ladder it opens is left-aligned. */
  .pp-pol{margin-top:12px;text-align:center}
  .pp-pol summary{color:var(--ink-soft);font-weight:600}
  .pp-pol ul{margin:8px auto 0;padding-left:17px;max-width:34ch;text-align:left}

  /* The paid keepsake breaks out of the 470px ticket column. The pass is a 1fr+230px grid and
     would otherwise sit permanently in its stacked mobile form, so the WRAPPER widens for this
     state — a max-width on the inner div cannot exceed its parent. */
  .pp-wrap.is-paid{max-width:780px}
  .pp-paid{text-align:center}
  .pp-paid .pass{margin-top:26px;text-align:left}
  .pp-paid .next{text-align:left;margin-top:26px}
  .pp-paid .pass-brand img{border-radius:6px}
  /* The CTA reads as not-yet until the terms are ticked (owner-caught 2026-08-02). Dimmed via a
     class rather than [disabled], so the button stays clickable and can name its own reason —
     see the aria-disabled note in startPayment. It fades between the two states rather than
     snapping, per the motion standard. */
  .pp-cta.is-off{opacity:.45;box-shadow:none}
  .pp-cta.is-off:hover{background:var(--btn-cta);transform:none}
  .pp-cta{transition:opacity .22s ease,background .22s ease,box-shadow .22s ease,transform .18s ease}
  @media (prefers-reduced-motion:reduce){ .pp-cta{transition:none} }
  /* The BUSY state (2026-08-05). The owner's 2026-08-01 call keeps the wait for /start +
     /checkout on the button rather than behind a full-screen takeover — right, but ticket.css's
     `[disabled]{opacity:.6}` alone was too quiet to read as "working", so payers pressed again.
     A moving spinner inside the button is the difference between "dimmed" and "busy". Full
     opacity deliberately: this control is ACTIVE, not unavailable. */
  .pp-cta.is-busy{opacity:1;cursor:progress}
  .pp-cta.is-busy:hover{background:var(--btn-cta);transform:none}
  .cta-spin{display:inline-block;width:15px;height:15px;margin-right:9px;vertical-align:-2px;
    border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
    animation:ppspin .7s linear infinite}
  @media (prefers-reduced-motion:reduce){ .cta-spin{animation:none} }

  /* What the payer is about to see. The single biggest wobble at a gateway hand-off is "is this
     page even mine?" — PayHere's checkout is teal, branded PayHere, and looks nothing like us.
     Naming the merchant line they will actually find there turns a surprise into a confirmation. */
  .pp-expect{margin:22px auto 0;max-width:340px;border:1px solid var(--line);border-radius:12px;
    background:var(--wash,#faf8f5);padding:12px 14px;text-align:left}
  .pp-expect b{display:block;font-size:.63rem;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
  .pp-expect .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .pp-expect .who{font-weight:700;font-size:.95rem;color:var(--ink)}
  .pp-expect .amt2{font-family:var(--display);font-weight:700;font-size:1.3rem;color:var(--ink)}
  .pp-loading .lead{font-size:.92rem;color:var(--ink-soft);max-width:38ch;margin:8px auto 0;line-height:1.55}
  .pp-loading h2{font-size:1.5rem;margin-bottom:2px}
  /* The hand-off, drawn rather than described: us → them, with something travelling the gap.
     A payer who can SEE they are being passed to a named gateway does not have to read a
     paragraph to know why the next page looks nothing like this one. Motion standard: the dot
     travels, it does not blink. */
  .pp-hop{display:flex;align-items:center;justify-content:center;gap:13px;margin:2px 0 20px}
  .pp-hop .chip{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;
    border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:.82rem;
    color:var(--ink);white-space:nowrap;box-shadow:var(--shadow-s)}
  .pp-hop .chip img{width:19px;height:19px;border-radius:5px;display:block}
  .pp-hop .track{position:relative;width:64px;height:2px;background:var(--line);border-radius:2px;overflow:hidden;flex:none}
  .pp-hop .track:after{content:'';position:absolute;top:0;left:-26px;width:26px;height:2px;
    background:var(--accent);animation:pphop 1.25s cubic-bezier(.45,0,.35,1) infinite}
  @keyframes pphop{0%{left:-26px}100%{left:64px}}
  @media (prefers-reduced-motion:reduce){ .pp-hop .track:after{animation:none;left:19px} }

  /* ── dead-end screen (spec 2026-07-31): sibling of 404.html's island scene ── */
  .de-wrap{text-align:center;padding:18px 0 8px}
  .de-art{width:min(430px,86vw);height:auto;display:block;margin:0 auto 6px}
  .de-eyebrow{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-deep)}
  .de-title{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,7vw,2.2rem);line-height:1.08;letter-spacing:0;color:var(--ink);margin:.3rem 0 .5rem}
  .de-lead{color:var(--ink-soft);font-size:.95rem;max-width:36ch;margin:0 auto}
  .de-cta{margin-top:20px}
  @keyframes de-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes de-spin{to{transform:rotate(360deg)}}
  @keyframes de-dash{to{stroke-dashoffset:-30}}
  @keyframes de-pin{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes de-sail{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(7px,-5px) rotate(2.5deg)}}
  .de-art .bob{animation:de-bob 5.5s ease-in-out infinite}
  .de-art .spin{animation:de-spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
  .de-art .dash{stroke-dasharray:6 9;animation:de-dash 2.6s linear infinite}
  .de-art .pin{animation:de-pin 3.4s ease-in-out infinite}
  .de-art .sail{animation:de-sail 4.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @media (prefers-reduced-motion:reduce){.de-art .bob,.de-art .spin,.de-art .dash,.de-art .pin,.de-art .sail{animation:none}}
</style>

<!-- Follow-along footer (owner, 2026-08-10) — the same one quote.html has carried since #412,

<footer class="pp-social">

  <a href="https://www.instagram.com/ceylonhop" aria-label="Ceylon Hop on Instagram" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.7 3.7 0 0 1-1.38-.9 3.7 3.7 0 0 1-.9-1.38c-.16-.42-.36-1.06-.41-2.23C2.17 15.58 2.16 15.2 2.16 12s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41C8.42 2.17 8.8 2.16 12 2.16zm0 3.68A6.16 6.16 0 1 0 18.16 12 6.16 6.16 0 0 0 12 5.84zm0 10.16A4 4 0 1 1 16 12a4 4 0 0 1-4 4zm6.41-10.4a1.44 1.44 0 1 0 1.44 1.44 1.44 1.44 0 0 0-1.44-1.44z"/></svg></a>

<script>
(function(){
  'use strict';
  var app = document.getElementById('app');
  var A = (window.CEYLON_HOP_API || '').replace(/\/$/, '');
  var q = new URLSearchParams(location.search);
  var t = q.get('t');
  // Set only on the leg BACK from the gateway. Carries a settlement-status token and nothing
  // else — deliberately not the pay token, which authorises the whole quote (spec §D4).
  var rt = q.get('rt');
  var cameFromCancel = q.get('c') === '1';
  var data = null;         // last /view payload
  var booking = null;      // { bookingId, checkoutToken } once /start succeeds
  var typed = null;        // raw form values, so a payment failure restores what they typed
  var submitting = false;  // one checkout per press — see startPayment

  // ── funnel + failure reporting (2026-08-07) ───────────────────────────────────────────
  // This page had NO client-side instrumentation at all, which is why a payment that died
  // inside the gateway left a `pending` row in Postgres and nothing else: we could not tell
  // how many payers reached the form, abandoned at billing, or came back on the cancel leg.
  // Both helpers are guarded — analytics must never be why a payment page breaks — and
  // neither ever carries a name, email, phone, address or pay token.
  function track(event, params){
    if (typeof window.chTrack === 'function') window.chTrack(event, params || {});
  }
  function report(what, err){
    var x = err || {};
    if (typeof window.chReportError === 'function') {
      window.chReportError('[pay] ' + what + (x.message ? ' — ' + x.message : ''), x.stack);
    }
  }
  // The quote's own money, in GA4's shape. `totals.cents` is the integer minor unit the
  // server sent; the displayed string is never parsed back into a number. On the return leg
  // /view has not been re-fetched yet, so fall back to the figure stashed at hand-off —
  // otherwise a real payment reports a value of zero.
  var stashedCents = 0;
  function money(){
    var c = data && data.totals ? Number(data.totals.cents || 0) : stashedCents;
    return { value: Math.round(c) / 100, currency: 'USD' };
  }
  function withMoney(extra){
    var p = money();
    if (extra) for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) p[k] = extra[k];
    return p;
  }
  // `purchase` is the one event that becomes revenue in GA4, and GA4 cannot delete events
  // after the fact. Two independent gates: the host must be a real one (chIsProd), and the
  // gateway we actually handed off to must not have been the sandbox — recorded at
  // hand-off time, because the return leg never sees the checkout URL.
  function sandboxUsed(){
    try { return sessionStorage.getItem(STORE + ':sandbox') === '1'; } catch (e) { return false; }
  }
  function markSandbox(isSandbox){
    try { sessionStorage.setItem(STORE + ':sandbox', isSandbox ? '1' : '0'); } catch (e) {}
  }
  function trackPurchase(reference){
    if (typeof window.chIsProd !== 'function' || !window.chIsProd()) return;
    if (sandboxUsed()) return;
    // Once per booking, whatever the customer does with the back button or a refresh. GA4
    // does dedupe on transaction_id in its ecommerce reports, but the raw event count feeds
    // everything else, so the guard lives here rather than being left to the platform.
    var seen = STORE + ':purchased';
    try {
      if (sessionStorage.getItem(seen) === String(reference || '1')) return;
      sessionStorage.setItem(seen, String(reference || '1'));
    } catch (e) { /* private mode — better a possible double than a missing purchase */ }
    track('purchase', withMoney({ transaction_id: reference || '' }));
  }

  // A press that is WORKING, not a control that is unavailable. Spinner + text, so the wait for
  // /start + /checkout reads as progress on the button itself (the owner's 2026-08-01 call: no
  // full-screen takeover until the gateway window is genuinely opening).
  function setBusy(btn, busy, label){
    if (!btn) return;
    btn.disabled = busy;
    btn.classList.toggle('is-busy', busy);
    if (busy) {
      btn.innerHTML = '<span class="cta-spin" aria-hidden="true"></span>' + esc(label);
      // Screen readers get the change announced rather than silently re-labelled mid-press.
      btn.setAttribute('aria-busy', 'true');
    } else {
      btn.textContent = label;
      btn.removeAttribute('aria-busy');
    }
  }

  function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}

      return '<option value="' + esc(n) + '"' + (n === selected ? ' selected' : '') + '>' + esc(n) + '</option>';
    }).join('');
  }

  // Returns country '' when the prefill doesn't SAY what the country is. Falling back to
  // Sri Lanka guessed on the payer's behalf: most of them are not Sri Lankan, and a wrong
  // dial code silently rewrites the number we'd reach them on — and rides along to the
  // gateway, where payer data feeds the issuer's 3DS decision (owner-caught, 2026-08-02).
  function splitPrefill(whatsapp){
    var raw = String(whatsapp || '').trim();
    if (!raw) return { country: '', number: '' };
    var digits = raw.replace(/[^\d]/g, '');
    var dc = /^\s*\+/.test(raw) ? matchDialCode(digits) : '';
    if (!dc) return { country: '', number: raw };
    for (var i = 0; i < COUNTRIES.length; i++) {
      if ((COUNTRIES[i][2] || '').replace(/[^\d]/g, '') === dc) {
        return { country: COUNTRIES[i][1], number: digits.slice(dc.length) };
      }
    }
    return { country: '', number: digits };
  }
  // booking.js phoneParts, ported: the select's dial code + the typed number → one whatsapp.
  // No country selected means no dial code to prefix — startPayment blocks on `noCountry`
  // rather than inventing one.
  function phoneParts(){
    var countryEl = document.getElementById('f-country');
    var phoneEl = document.getElementById('f-phone');
    var country = (countryEl && countryEl.value ? countryEl.value : '').trim();
    var selCode = '';
    for (var i = 0; i < COUNTRIES.length; i++) if (COUNTRIES[i][1] === country) { selCode = COUNTRIES[i][2]; break; }
    var selDigits = selCode.replace(/[^\d]/g, '');
    var raw = (phoneEl && phoneEl.value ? phoneEl.value : '').trim();
    var digits = raw.replace(/[^\d]/g, '');
    if (/^\s*\+/.test(raw)) {
      var dc = matchDialCode(digits);
      return { country: country, whatsapp: '+' + digits, empty: !digits, noCountry: !country, _dc: dc };
    }
    var number = digits.replace(/^0+/, '');
    if (selDigits && number.indexOf(selDigits) === 0 && number.length > selDigits.length) {
      number = number.slice(selDigits.length); // typed the code too — don't double it
    }
    return { country: country, whatsapp: selCode + number, empty: !number, noCountry: !country };
  }

  function renderDetails(){
    var pre = data.prefill || {};
    var split = splitPrefill(pre.whatsapp);

    var options = '<option value=""' + (split.country ? '' : ' selected') + '>Choose…</option>'

        return '<option value="' + esc(c[1]) + '"' + (c[1] === split.country ? ' selected' : '') + '>'

      + '<div class="fld"><label for="f-firstName">First name</label><input id="f-firstName" name="ch-given" type="text" value="' + esc(pre.firstName || '') + '" autocomplete="off" /></div>'
      + '<div class="fld"><label for="f-lastName">Last name</label><input id="f-lastName" name="ch-family" type="text" value="' + esc(pre.lastName || '') + '" autocomplete="off" /></div>'
      + '<div class="fld"><label for="f-email">Email</label><input id="f-email" name="ch-mail" type="email" value="' + esc(pre.email || '') + '" autocomplete="off" /></div>'
      + '<div class="dt-2col dt-phone">'

      + '<div class="dt-kick">Billing details <span>· as they appear on the card</span></div>'
      + '<label class="dt-chk"><input id="f-diffbill" type="checkbox"' + (typed && typed.billDiffers ? ' checked' : '') + ' />'

      + '<div id="billnames" class="dt-2col"' + (typed && typed.billDiffers ? '' : ' hidden') + '>'
      +   '<div class="fld"><label for="f-bfirst">Cardholder first name</label><input id="f-bfirst" type="text" value="' + esc((typed && typed.billFirst) || '') + '" autocomplete="billing given-name" /></div>'
      +   '<div class="fld"><label for="f-blast">Cardholder last name</label><input id="f-blast" type="text" value="' + esc((typed && typed.billLast) || '') + '" autocomplete="billing family-name" /></div>'
      + '</div>'
      + '<div class="fld"><label for="f-bcountry">Country</label><select id="f-bcountry" autocomplete="billing country">' + billingCountryOptions((typed && typed.billCountry) || split.country) + '</select></div>'
      + '<div class="fld"><label for="f-addr">Billing address</label><input id="f-addr" type="text" value="' + esc((typed && typed.address) || '') + '" placeholder="Street and number" autocomplete="billing street-address" /></div>'
      + '<div class="dt-2col">'
      +   '<div class="fld"><label for="f-city">City</label><input id="f-city" type="text" value="' + esc((typed && typed.city) || '') + '" placeholder="e.g. Amsterdam" autocomplete="billing address-level2" /></div>'
      // State/province, added 2026-08-02: without it US and Canadian payers wrote "Jersey
      // City, NJ" into the city box, and city is exactly what gets forwarded as the city.
      // Optional in the label because most of the world has no such thing.
      +   '<div class="fld"><label for="f-state">State / Province <span>optional</span></label><input id="f-state" type="text" value="' + esc((typed && typed.state) || '') + '" placeholder="e.g. NJ" autocomplete="billing address-level1" /></div>'
      + '</div>'
      + '<div class="fld"><label for="f-postcode" id="f-postcode-label">Postcode / ZIP <span>optional</span></label><input id="f-postcode" type="text" value="' + esc((typed && typed.postcode) || '') + '" autocomplete="billing postal-code" /></div>'
      + '<label class="dt-chk dt-terms"><input id="f-terms" type="checkbox"' + (typed && typed.terms ? ' checked' : '') + ' />'
      +   '<span>I agree to the <a href="terms.html#refunds" target="_blank" rel="noopener">Terms &amp; cancellation policy</a>.'
      +   '<b>' + esc(pol.headline) + '</b></span></label>'
      + '<details class="dt-pol"><summary>See the full cancellation policy</summary><ul>'
      +   pol.rows.map(function(rw){ return '<li>' + esc(rw) + '</li>'; }).join('')
      + '</ul></details>'
      + '</div>'
      + '<div class="perf"></div><div class="t-stub">'
      + linesHtml(data.lines)
      + (data.coverage ? '<p class="coverage">' + esc(coverageSentence(data.coverage)) + '</p>' : '')
      + totalsHtml(data.copy, data.totals, data.discount)
      + '<button class="btn btn-cta pp-cta' + (typed && typed.terms ? '' : ' is-off') + '" id="gobtn">Continue to payment</button>'
      + '<p class="pp-err" id="payerr" hidden></p>'
      + '<div class="pp-help" id="payhelp" hidden></div>'
      + '</div></div>' + waLine();
    // Focus the first empty box — usually email, or the number for email-contact quotes.
    var order = ['f-firstName', 'f-lastName', 'f-email', 'f-country', 'f-phone', 'f-addr'];
    for (var i = 0; i < order.length; i++) {
      var el = document.getElementById(order[i]);
      if (el && !el.value) { el.focus(); break; }
    }
    // The billing country was set ONCE from the phone prefill and then never moved, so
    // changing the dial code to United States left the billing country reading Sri Lanka
    // (owner-caught, 2026-08-02). It now FOLLOWS the phone country — until the payer picks a
    // billing country themselves, after which their choice is never overwritten.
    var phoneSel = document.getElementById('f-country'), billSel = document.getElementById('f-bcountry');
    var billTouched = false;
    billSel.addEventListener('change', function(){ billTouched = true; });
    phoneSel.addEventListener('change', function(){
      if (billTouched) return;
      var name = (phoneSel.value || '').trim();
      // Only if that country exists in the billing list — the two are built from one source,
      // so this is belt-and-braces rather than an expected miss.
      for (var i = 0; i < billSel.options.length; i++) {
        if (billSel.options[i].value === name) { billSel.value = name; return; }
      }
    });

    var diff = document.getElementById('f-diffbill'), names = document.getElementById('billnames');
    diff.addEventListener('change', function(){
      names.hidden = !diff.checked;
      if (diff.checked) document.getElementById('f-bfirst').focus();
    });
    // The CTA is dimmed until the terms are ticked, so consent reads as a precondition instead of
    // an error you discover after committing (owner-caught 2026-08-02).
    //
    // Dimmed only — NOT disabled, and deliberately not aria-disabled either. Both make the button
    // inert: the click is swallowed and nothing explains why, so a payer who hasn't spotted the
    // checkbox two rows up reads a dead button as a broken page and leaves, on the last screen
    // before the money. Every other requirement on this form (address, city, email) is enforced
    // the same way — press, and it tells you what's missing — and the terms are no different.
    // Pressing also drops focus on the checkbox, so the fix is one keystroke away.
    var terms = document.getElementById('f-terms'), go = document.getElementById('gobtn');
    terms.addEventListener('change', function(){ go.classList.toggle('is-off', !terms.checked); });
    go.addEventListener('click', startPayment);

  // Shown in the instant between form.submit() and the browser leaving for payhere.lk. It is
  // usually on screen for a blink, but on a slow connection it is the difference between "this
  // is working" and a dead button.
  //
  // It no longer says "don't close this page": the customer is being sent TO PayHere, not shown
  // a window on top of us, and telling them to stay here would be a lie about where they are.
  function renderLoading(){
    app.innerHTML = '<div class="pp-loading">'
      + '<div class="pp-hop">'
      +   '<span class="chip"><img src="img/brand-c.svg" alt="" width="19" height="19">Ceylon Hop</span>'
      +   '<span class="track"></span>'
      +   '<span class="chip">🔒 PayHere</span>'
      + '</div>'
      + '<h2>Taking you to PayHere…</h2>'
      + '<p class="lead">You’ll finish paying on PayHere’s own secure page, then come '
      +   'straight back here. We never see your card details.</p>'
      // The amount lives ONLY in the preview card. It was above this as a big standalone figure
      // too, and the same number twice on one short screen reads as a bug rather than emphasis.
      //
      // The merchant line is quoted as PayHere actually prints it — verified against the live
      // checkout 2026-08-05. If the gateway customization name is ever changed in the PayHere
      // dashboard, change it here too: a reassurance that does not match what they land on is
      // worse than no reassurance at all.
      + '<div class="pp-expect"><b>On the next screen you should see</b>'
      +   '<div class="row"><span class="who">Ceylon Hop (PVT) LTD</span>'
      +   '<span class="amt2">' + esc(data.totals.usd) + '</span></div></div>'
      // "come straight back here" already appears in the lead — repeating it here was the same
      // reassurance twice in six lines, which reads as padding rather than emphasis.
      + '<p>Central Bank approved · no extra fees</p>'
      // What PayHere makes them do on the way back. Owner-observed 2026-08-05: the gateway does
      // NOT redirect on its own — it parks the payer on "Payment Approved" (or "Payment
      // Declined") behind a manual "Back to Site" link. A payer who is not told that closes the
      // tab, and never sees their confirmation.
      + '<p class="lead" style="margin-top:12px">When PayHere is done, tap <strong>Back to '
      +   'Site</strong> to get your confirmation.</p></div>';
  }

  // Shared with booking.html — see decline-help.js for why this copy says what it says.
  var DECLINE_HELP = window.CH_DECLINE_HELP || [];

  // `quiet` collapses the decline steps behind a summary instead of printing them open.
  //
  // Why it exists (2026-08-05, from a real decline on CH-R3ZBZ): PayHere does NOT always send a
  // notify when a card is refused — that order carries exactly ONE payment_event, the later
  // success, so the decline itself never reached us. When that happens our payment row stays
  // `pending`, /bookings/pay-return answers `pending`, and the confident "your card was declined"
  // branch never fires. The payer who most needs these four steps was the one least likely to see
  // them. But most people arriving with no verdict simply changed their mind, and four paragraphs
  // about phoning a bank would be noise — hence available, not asserted.
  function fail(msg, help, quiet){
    // If the interstitial (or PayHere) is on screen, rebuild the details step first —
    // with the customer's typed values — then surface the error on it.
    if (!document.getElementById('gobtn') && !document.getElementById('paybtn')) renderDetails();
    var e = document.getElementById('payerr');
    if (e) { e.textContent = msg; e.hidden = false; }
    // Only after a real attempt at the gateway. A validation miss ("enter your billing city")
    // must not hand the payer four paragraphs about phoning their bank.
    var h = document.getElementById('payhelp');
    if (h) {
      if (help && help.length) {
        var steps = '<ol>' + help.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ol>';
        h.innerHTML = quiet
          ? '<details class="pp-quiet"><summary>Card refused? Here’s what usually fixes it</summary>'
            + steps + '</details>'
          : '<h3>If your card was declined</h3>' + steps;
        h.hidden = false;
      } else {
        h.innerHTML = '';
        h.hidden = true;
      }
    }
    // Release the latch. Without this a refused card, a validation miss or a timeout would leave
    // the button locked and the payer with no way to retry at all — strictly worse than the
    // double-click it guards against.
    submitting = false;
    var b = document.getElementById('gobtn') || document.getElementById('paybtn');
    if (b) setBusy(b, false, b.id === 'gobtn' ? 'Continue to payment' : 'Pay with PayHere');
  }

  function startPayment(){
    var parts = phoneParts();
    typed = {
      firstName: (document.getElementById('f-firstName').value || '').trim(),
      lastName: (document.getElementById('f-lastName').value || '').trim(),
      email: (document.getElementById('f-email').value || '').trim(),
      country: (document.getElementById('f-country').value || '').trim(),
      phone: (document.getElementById('f-phone').value || '').trim(),
      address: (document.getElementById('f-addr').value || '').trim(),
      city: (document.getElementById('f-city').value || '').trim(),
      postcode: (document.getElementById('f-postcode').value || '').trim(),
      state: (document.getElementById('f-state').value || '').trim(),
      billCountry: (document.getElementById('f-bcountry').value || '').trim(),
      billDiffers: document.getElementById('f-diffbill').checked,
      billFirst: (document.getElementById('f-bfirst').value || '').trim(),
      billLast: (document.getElementById('f-blast').value || '').trim(),
      terms: document.getElementById('f-terms').checked,
    };
    // Each block reports WHICH field stopped them. A payer who gives up at the billing
    // address and one who never ticked the terms are different problems with different
    // fixes, and until now both were simply absent from every report. The reason is a fixed
    // keyword, never the value they typed.
    function blocked(reason){ track('pay_form_invalid', withMoney({ reason: reason })); }
    // The country is asked, never assumed — and the server requires it (customer.country is
    // min(1)), so a blank one would 400 at the gateway door instead of here.
    if (parts.noCountry) { blocked('country'); fail('Please choose your country code.'); return; }
    if (parts.empty) { blocked('phone'); fail('Please enter your WhatsApp number.'); return; }
    // Billing is required: it goes to the card gateway, which used to be handed a hardcoded
    // placeholder. Name each empty box rather than a generic "check the form".
    if (!typed.address) { blocked('address'); fail('Please enter your billing address.'); return; }
    if (!typed.city) { blocked('city'); fail('Please enter your billing city.'); return; }
    if (!typed.billCountry) { blocked('bill_country'); fail('Please choose your billing country.'); return; }
    if (!typed.terms) {
      blocked('terms');
      fail('Please accept the terms & cancellation policy to continue.');
      // fail() rebuilds the step, so re-find the box; focus is what turns "you must" into "here".
      var box = document.getElementById('f-terms');
      if (box) { box.focus(); }
      return;
    }
    if (typed.billDiffers && (!typed.billFirst || !typed.billLast)) {
      blocked('cardholder');
      fail('Please enter the cardholder’s first and last name.'); return;
    }
    var billing = {
      address: typed.address, city: typed.city, country: typed.billCountry,
    };
    // OMIT rather than send '': BillingInput requires a non-empty string when the key is
    // present, so an empty postcode would 400 — the same block on a Hong Kong or UAE payer,
    // just moved to the server. Caught by the e2e, not by reading the code.
    if (typed.postcode) billing.postcode = typed.postcode;
    if (typed.state) billing.state = typed.state;
    if (typed.billDiffers) { billing.firstName = typed.billFirst; billing.lastName = typed.billLast; }
    var customer = {
      firstName: typed.firstName,
      lastName: typed.lastName,
      email: typed.email,
      whatsapp: parts.whatsapp,
      country: parts.country,
    };
    // SUPERSEDES the 2026-08-01 owner call ("keep the wait on the button"). That decision was
    // made when the takeover said "don't close this page" and lied about a modal opening over
    // us. Now the takeover is TRUE the moment it appears — we are leaving for PayHere — and the
    // owner's 2026-08-05 call, watching the real flow, is that pressing Continue must land on
    // "Taking you to PayHere…" straight away rather than on a button that merely dims.
    //
    // A failure still rebuilds the form: fail() re-renders the details step when neither button
    // is on screen, so a dead API drops them back where they were rather than stranding them
    // behind a spinner.
    // Belt AND braces against a second checkout. `disabled` alone is not enough: fail() re-enables
    // the button, a stray re-render would hand back a fresh one, and a double-tap on mobile can
    // land two clicks before the first repaint. `submitting` is the one that cannot be undone by
    // the DOM — and two checkouts means two PayHere hand-offs for one booking.
    if (submitting) return;
    submitting = true;
    // Everything the form needed is in hand and we are about to leave for the gateway.
    track('add_payment_info', withMoney());
    // Straight to the hand-off screen. The button latch stays because a double-tap can land two
    // clicks in the same frame, before this repaint removes the button at all.
    setBusy(document.getElementById('gobtn'), true, 'Opening secure payment…');
    renderLoading();
    fetchJson(A + '/quotes/pay/start', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ t: t, customer: customer, billing: billing, termsAccepted: true }),
    }).then(function(r){
      if (r.ok) return r.json();
      return r.json().catch(function(){ return {}; }).then(function(x){
        // A refusal at OUR door, before the gateway is ever reached. Named, because
        // "quote changed underneath them" and "the API is down" are not the same story.
        track('payment_start_failed', withMoney({ reason: String(x.error || ('http_' + r.status)) }));
        if (x.error === 'quote_revised') { renderRevised(); throw { handled: true }; }
        if (x.error === 'already_paid') { load(); throw { handled: true }; }
        report('pay/start refused', new Error(String(x.error || r.status)));
        throw new Error(x.message || 'We couldn’t start your payment just now — no charge was made.');
      });
    }).then(function(st){
      booking = st;
      // `returnTo` states INTENT, never a URL: the server builds the return address from its own
      // config, because a gateway that redirects wherever the request body says is a phishing
      // primitive. See api/src/routes/bookings.ts.
      return fetchJson(A + '/bookings/' + st.bookingId + '/checkout', {
        method: 'POST',
        headers: { authorization: 'Bearer ' + st.checkoutToken, 'content-type': 'application/json' },
        body: JSON.stringify({ returnTo: 'pay-link' }),
      }).then(function(r){
        if (!r.ok) {
          track('payment_start_failed', withMoney({ reason: 'checkout_' + r.status }));
          report('checkout refused', new Error('checkout ' + r.status));
          throw new Error('We couldn’t start your payment just now — no charge was made.');
        }
        return r.json();
      });
    }).then(function(checkout){
      if (!checkout || !checkout.checkoutUrl) throw new Error('We couldn’t start your payment just now — no charge was made.');
      if (!/payhere\.lk/.test(checkout.checkoutUrl)) {
        // Dev/fake gateway: be honest rather than simulate a payment that never happened.
        throw new Error('Payments aren’t enabled on this environment yet — nothing was charged.');
      }
      if (!checkout.fields) throw new Error('We couldn’t start your payment just now — no charge was made.');
      // Remember the link before leaving our origin: the return trip lands on a URL that carries
      // only a settlement-status token, so this is how the page finds its way back to the quote.
      remember();
      // Record WHICH gateway we are handing off to, before we lose sight of the URL. The return
      // leg never sees it, and a sandbox settlement reported as revenue is permanent in GA4.
      markSandbox(/sandbox\.payhere\.lk/.test(checkout.checkoutUrl));
      // The last thing we know for certain: they left for the gateway. Everything after this
      // is inferred from what our own server tells us on the way back.
      track('payment_initiated', withMoney());
      // A TOP-LEVEL form POST — the whole point of this page's redesign. PayHere's checkout takes
      // ~16 POST fields, so it cannot be a location assignment. The fields are the server's
      // verbatim: `hash` covers merchant_id + order_id + amount + currency and is signed server
      // side, so reordering, renaming or adding anything here would be refused by the gateway.
      var form = document.createElement('form');
      form.method = 'POST';
      form.action = checkout.checkoutUrl;
      Object.keys(checkout.fields).forEach(function(k){
        var input = document.createElement('input');
        input.type = 'hidden';
        input.name = k;
        input.value = checkout.fields[k];
        form.appendChild(input);
      });
      document.body.appendChild(form);
      // (The hand-off screen is already up — painted the instant they pressed, above.)
      form.submit();
    }).catch(function(e){ if (!e || !e.handled) fail(e && e.message ? e.message : 'Something went wrong — no charge was made.'); });
  }

  // (The old awaitSettle() lived here. It existed to poll after PayHere's SDK fired onCompleted
  // in-page; with the redirect there is no in-page completion to hear, and renderReturn() below
  // does the polling on the way back instead.)

  // ── the return leg ──────────────────────────────────────────────────────────────────────────
  // PayHere passes NO payment status back on the redirect — their Checkout API docs say so
  // outright: "You need to update your database upon fetching payment status by your script on
  // notify_url & then show the payment status to your customer in the page on return_url by
  // fetching the status from your database." So nothing in this URL is read as an outcome. We ask
  // our own server, which the webhook owns.
  //
  // `c=1` only means the gateway used cancel_url. It is a display hint, NEVER truth: PayHere
  // documents return_url for an approved payment and cancel_url for a cancelled one, and says
  // nothing at all about where a DECLINED payment lands — so both legs poll identically.
  var RETURN_TRIES = 30;
  // Owner-observed on the live gateway (2026-08-05): PayHere does NOT redirect by itself. It
  // parks the payer on "Payment Approved" / "Payment Declined" behind a manual "Back to Site"
  // link — so a DECLINE arrives here on the cancel leg too, not only a change of mind. The
  // cancel budget therefore has to be long enough for a decline's notify to land, not merely
  // long enough to be polite.
  var CANCEL_TRIES = 8;
  // ...and none of that may cost the payer a stare. Waiting is decoupled from what is ON SCREEN:
  // after this long we put their form back and keep checking underneath, upgrading the moment an
  // answer arrives. Owner-reported: "Checking where that left things…" held the screen far too
  // long before showing anything useful.
  var FIRST_PAINT_MS = 1400;

  function renderReturn(){
    app.innerHTML = '<div class="st-wrap"><div class="st-badge ok">⏳</div>'
      + '<h1 class="st-title">' + (cameFromCancel ? 'Checking where that left things…' : 'Confirming your payment…') + '</h1>'
      + '<p class="st-sub">This usually takes a few seconds.</p></div>';
    var tries = 0;
    var budget = cameFromCancel ? CANCEL_TRIES : RETURN_TRIES;
    // Which leg we came back on, for reporting ONLY. Computed here, beside the budget — the
    // one other thing the hint is allowed to influence — and deliberately not inside the
    // poll: `cameFromCancel` must stay nowhere near the code that decides an outcome, which
    // is the invariant pay-page-redirect.test.js exists to hold.
    var leg = cameFromCancel ? 'cancel' : 'return';
    var settled = false;   // a terminal answer arrived; stop everything
    var fellBack = false;  // the form is already on screen, polling continues underneath

    // Stop making them watch a spinner. Their details are restored and the page is usable again;
    // if an answer lands later it simply replaces this.
    var fallback = setTimeout(function(){
      if (settled || !t) return;
      fellBack = true;
      resumeAfterFailure('Just checking your payment with the bank — nothing has been charged unless you completed it on PayHere.', DECLINE_HELP, true);
    }, FIRST_PAINT_MS);

    function stop(){ settled = true; clearTimeout(fallback); }

    (function poll(){
      tries++;
      fetchJson(A + '/bookings/pay-return?rt=' + encodeURIComponent(rt)).then(function(r){
        if (!r.ok) throw new Error('pay-return ' + r.status);
        return r.json();
      }).then(function(v){
        if (v.status === 'paid') {
          stop(); forget();
          trackPurchase(v.reference);
          return t ? load() : renderPaidMinimal(v.reference);
        }
        // A refusal must never read as an endless "confirming" — the whole point of asking our
        // own server rather than trusting the redirect.
        if (v.status === 'failed') {
          stop();
          track('payment_failed', withMoney({ leg: leg }));
          return resumeAfterFailure('The payment didn’t go through — no charge was made. You can try again below.', DECLINE_HELP);
        }
        if (tries < budget) { setTimeout(poll, 2000); return; }
        stop();
        // The poll budget ran out with no verdict. THIS is the state behind the `pending`
        // rows: not a decline, not a success, just a payer who left and never came back to a
        // definite answer. It had no name and no number until now.
        track(cameFromCancel ? 'payment_cancelled' : 'payment_unconfirmed', withMoney({ leg: leg, tries: tries }));
        // Nothing terminal ever arrived. If the form is already up, just retire the "checking"
        // line in place — re-rendering underneath someone who has started typing again is worse
        // than a stale sentence.
        if (fellBack) {
          var e = document.getElementById('payerr');
          if (e) {
            e.textContent = cameFromCancel
              ? 'You came back without finishing the payment — nothing was charged. Your details are still here.'
              : 'We haven’t had confirmation yet — nothing was charged unless you completed the payment. We’ll email you if it lands.';
          }
          return;
        }
        if (cameFromCancel) {
          return resumeAfterFailure('You came back without finishing the payment — nothing was charged. Your details are still here.', DECLINE_HELP, true);
        }
        renderStillWaiting();
      }).catch(function(e){
        if (tries < budget) { setTimeout(poll, 2000); return; }
        stop();
        // Every poll failed. The customer may well have paid; we simply cannot ask.
        report('pay-return unreachable', e);
        track('payment_unconfirmed', withMoney({ leg: leg, tries: tries, reason: 'unreachable' }));
        if (!fellBack) renderStillWaiting();
      });
    })();
  }

  // Paid, but this tab lost the pay token (storage cleared, or they finished in another tab).
  // The money is in and saying so plainly beats a keepsake we cannot faithfully build.
  function renderPaidMinimal(reference){
    app.innerHTML = '<div class="st-wrap"><div class="st-badge ok">&#10003;</div>'
      + '<h1 class="st-title">You’re booked.</h1>'
      + '<p class="st-sub">Payment received. Your confirmation is on its way by email.</p>'
      + (reference ? '<p class="st-sub">Booking ref <strong>' + esc(reference) + '</strong></p>' : '')
      + '</div>' + waLine();
  }

  function renderStillWaiting(){
    app.innerHTML = '<div class="st-wrap"><div class="st-badge ok">⏳</div>'
      + '<h1 class="st-title">Payment received?</h1>'
      + '<p class="st-sub">Confirmation is taking longer than usual. Your bank may still be processing — '
      + 'we’ll email you the moment it lands, or just WhatsApp us.</p></div>' + waLine();
  }

  // Put them back on the form they left, with what they typed. The caller says WHY they are back
  // — a refusal (with the decline steps) or their own change of mind (without) — because the two
  // deserve different words and the wrong one is worse than none.
  function resumeAfterFailure(message, help, quiet){
    if (!t) return renderCannotResume();
    fetchJson(A + '/quotes/pay/view?t=' + encodeURIComponent(t)).then(function(r){
      if (!r.ok) throw new Error('view ' + r.status);
      return r.json();
    }).then(function(v){
      data = v;
      if (v.state === 'paid') { forget(); return renderPaid(v.paid); }
      if (v.state === 'revised') return renderRevised();
      if (v.state !== 'payable') return renderUnavailable();
      renderDetails();
      fail(message, help, quiet);
    }).catch(function(){ renderCannotResume(); });
  }

  function renderCannotResume(){
    app.innerHTML = '<div class="st-wrap"><div class="st-badge ok">!</div>'
      + '<h1 class="st-title">That payment didn’t go through</h1>'
      + '<p class="st-sub"><strong>Nothing has been charged.</strong> Open your payment link again to retry, '
      + 'or message us on WhatsApp and we’ll sort it out.</p></div>' + waLine();
  }

  // ── boot ────────────────────────────────────────────────────────────────────────────
  function load(){
    fetchJson(A + '/quotes/pay/view?t=' + encodeURIComponent(t || '')).then(function(r){
      if (!r.ok) throw new Error('view ' + r.status);
      return r.json();
    }).then(function(v){
      data = v;
      // Every arrival is counted with the state it landed in, so "how many pay links get
      // opened at all" and "how many arrive already dead" stop being the same unknown.
      track('pay_link_opened', withMoney({ state: String(v.state || 'unknown') }));
      if (v.state === 'paid') { forget(); return renderPaid(v.paid); }
      if (v.state === 'revised') return renderRevised();
      if (v.state === 'payable') return renderPayable();
      return renderUnavailable();
    }).catch(function(e){
      // This used to swallow a dead or 500-ing API into the same friendly dead-end a
      // genuinely expired link gets — so an outage on the pay endpoint was invisible to us
      // until a customer complained. It reports now, and still shows the same screen.
      report('view failed', e);
      track('pay_link_opened', { state: 'error' });
      renderUnavailable();
    });
  }

  if (rt) {
    // Coming back from the gateway. The pay token is not in this URL by design, so recover it —
    // and what they typed — from the tab's own storage.
    var saved = recall();
    if (saved) {
      if (!t && saved.t) t = saved.t;
      if (saved.typed) typed = saved.typed;
      // What the trip cost, for the `purchase` value — /view has not run on this leg yet.
      if (saved.cents) stashedCents = Number(saved.cents) || 0;
    }
    renderReturn();
  } else if (!t) {
    // No token at all: a truncated link, or someone trimming the URL back. Worth counting —
    // it is indistinguishable, in the server logs, from a link that was never clicked.
    track('pay_link_opened', { state: 'no_token' });
    renderUnavailable();
  } else {
    load();
  }
})();
</script>
</body>
</html>
