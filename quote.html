<script>
(function(){
  'use strict';
  // The read-only counterpart to pay.html: a proposal, not a payment. Spec D6 — there is no
  // pay button and no link to /p anywhere on this page. Every action the customer can take is
  // a wa.me deep link, which is what makes a forwarded copy of this URL harmless to forward.
  var app = document.getElementById('app');
  // Same contract as pay.html: window.CEYLON_HOP_API is injected by customerPages when the API
  // host serves this file; the hard-coded default is the fallback for the customer site.
  var API = (window.CEYLON_HOP_API || 'https://api.ceylonhop.com').replace(/\/$/, '');
  var WA = '94779669662';
  var token = new URLSearchParams(location.search).get('t') || '';

  function waHref(text){ return 'https://wa.me/' + WA + '?text=' + encodeURIComponent(text); }

  // ── funnel + failure reporting (2026-08-07) ─────────────────────────────────────────
  // This page pushed nothing, so a quote we sent and a quote nobody opened looked identical.
  // Guarded, and never carrying a name, a token or anything else from the quote itself.
  function track(event, params){
    if (typeof window.chTrack === 'function') window.chTrack(event, params || {});
  }
  function report(what, err){
    var x = err || {};
    if (typeof window.chReportError === 'function') {
      window.chReportError('[quote] ' + what + (x.message ? ' — ' + x.message : ''), x.stack);
    }
  }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]; }); }

  // Clarity masks form INPUTS by default, not rendered text — and this page renders the
  // customer's first name straight into the greeting. Mask the person, keep the trip: an
  // itinerary and two prices are exactly what a replay is worth watching for.
  var MASK = ' data-clarity-mask="true"';

  // Every path that replaces the first-paint skeleton goes through here, same as manage.html's
  // paint() — clearing aria-busy matters as much as clearing the class.
  function paint(html){
    app.innerHTML = html;
    app.classList.remove('tk-sk');
    app.removeAttribute('aria-busy');
    app.removeAttribute('aria-label');
  }

  // Every call gets a deadline — see pay.html's fetchJson for why: a stalled API must not
  // leave this page's skeleton shimmering forever with no way to tell the difference between
  // "still loading" and "will never load".
  var NET_TIMEOUT_MS = 20000;
  function fetchJson(url){
    if (typeof AbortController === 'undefined') return fetch(url);
    var ctl = new AbortController();
    var timer = setTimeout(function(){ ctl.abort(); }, NET_TIMEOUT_MS);
    return fetch(url, { signal: ctl.signal }).then(
      function(r){ clearTimeout(timer); return r; },
      function(){ clearTimeout(timer); throw new Error('timed out'); }
    );
  }

  // First paint is the page's own shape, not a bare line of text — ticket.css grew .tk-sk
  // because pay.html's unskeletoned first paint jumped, and this page is heavier: a hero line,
  // a map-sized block and one option card, all shimmering until /quote-view answers.
  // The shapes must match what actually renders — an extra bar here for a hero total the page
  // no longer draws would make the skeleton lie about the layout it is standing in for.
  function renderSkeleton(){
    app.className = 'tk-sk';
    app.setAttribute('aria-busy', 'true');
    app.setAttribute('aria-label', 'Loading your quote');
    app.innerHTML = '<i class="sk-hello"></i><i class="sk-title"></i><i class="sk-sub"></i>'
      + '<i class="sk-held"></i>'
      + '<i class="sk-map"></i>'
      + '<i class="sk-opt"></i>';
  }

  // '2026-08-12T00:00:00.000Z' → 'Tue 12 August'. Local time deliberately: an expiry date is a
  // deadline for whoever is reading it, not a UTC instant they have to convert themselves.
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function heldLabel(iso){
    var d = new Date(iso);
    if (!iso || isNaN(d.getTime())) return '';
    return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  }

  // The expiry row — the share card's clock treatment; .warn variant keeps ONE system across
  // live and lapsed rather than a second banner design.
  //
  // "Quote expires on" (owner, 2026-08-06), not "Held until". What expires is the PRICE, never
  // the link: past this date the same URL still opens and still shows the whole itinerary, it
  // just says the price needs refreshing (spec D8 — link liveness is the quote's status, and
  // has no clock). The sub-line carries that distinction so "expires" can't read as "gone".
  function heldRow(validUntil, lapsed){
    var label = heldLabel(validUntil);
    if (!label) return '';
    return '<div class="held' + (lapsed ? ' warn' : '') + '">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l4 2.5"/></svg>'
      + '<span>' + (lapsed ? 'This quote expired on ' : 'Quote expires on ') + esc(label)
      + '<small>' + (lapsed
          ? 'Your trip is still here — message us and we’ll refresh the price.'
          : 'This price is locked for you until then.')
      + '</small></span></div>';
  }

  // The live map will not look like this island — this art is the DESIGNED FALLBACK (per the
  // prototype): what renders when the Maps key is missing, blocked by referrer, or routing
  // fails. mountMap() below only ever replaces it; it never has to draw it.
  var MAP_ART = '<svg viewBox="0 0 380 210" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    + '<rect width="380" height="210" fill="#dfeee9"/>'
    + '<path d="M150 8 C196 20 214 62 210 104 C206 150 178 196 150 204 C118 194 96 150 100 104 C104 60 118 20 150 8 Z" fill="#f2f0e2" stroke="#cfe0d8" stroke-width="1.5"/>'
    + '<path d="M136 34 L170 62 L150 104 L178 132 L156 176" fill="none" stroke="#0AB9B6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>'
    + '<g font-family="Poppins" font-size="9" font-weight="700" fill="#fff">'
    + '<circle cx="136" cy="34" r="9" fill="#24758A"/><text x="136" y="37.5" text-anchor="middle">1</text>'
    + '<circle cx="170" cy="62" r="9" fill="#0AB9B6"/><text x="170" y="65.5" text-anchor="middle">2</text>'
    + '<circle cx="150" cy="104" r="9" fill="#0AB9B6"/><text x="150" y="107.5" text-anchor="middle">3</text>'
    + '<circle cx="178" cy="132" r="9" fill="#0AB9B6"/><text x="178" y="135.5" text-anchor="middle">4</text>'
    + '<circle cx="156" cy="176" r="9" fill="#EC3A24"/><text x="156" y="179.5" text-anchor="middle">5</text>'
    + '</g></svg>';

  // No route to draw with fewer than two stops — skip the whole card rather than show a map
  // that can't mean anything (spec: idle-day pricing stays deliberately understated, and an
  // empty map would be worse than no map).
  function mapTicketHtml(v){
    if (!v.mapStops || v.mapStops.length < 2) return '';
    var feet = '<span><b>' + v.mapStops.length + '</b> stops</span>';
    if (v.totalKm != null) feet += '<span><b>' + v.totalKm + ' km</b> total</span>';
    feet += '<span><b>' + v.travelDays + '</b> travel day' + (v.travelDays === 1 ? '' : 's') + '</span>';
    // No Expand button drawn here: ch-map.js injects its OWN (.ch-map-expand) once a live map
    // renders, and it is the only one wired to anything. Ours was decorative — a control that
    // did nothing, and which sat on top of the static island in exactly the failure state where
    // there is nothing to expand.
    return '<div class="ticket"><div class="map" id="map">' + MAP_ART + '</div>'
      + '<div class="map-foot">' + feet + '</div></div>';
  }

  // The map is DEFERRED until it scrolls into view: ch-map.js memoises per page load, so every
  // open bills a computeRoutes call, and this page is designed to be opened repeatedly.
  //
  // onFail is NOT optional here. renderRoute() replaces the host with its own loading markup the
  // moment it starts, destroying the island above — so on any failure path (missing key, blocked
  // referrer, unroutable stops, its 12s timeout) a caller without onFail is left with a spinner
  // turning forever. A referrer-restricted key that hasn't had this hostname added is the likely
  // first-deploy state, which makes that the DEFAULT experience, not an edge case. Putting the
  // art back is what makes the fallback read as designed rather than broken.
  function mountMap(stops, runs){
    var host = document.getElementById('map');
    if (!host || !window.CH_MAP || stops.length < 2) return;
    var art = host.innerHTML;
    var io = new IntersectionObserver(function(entries){
      if (!entries[0].isIntersecting) return;
      io.disconnect();
      window.CH_MAP.renderRoute(host, stops, {
        // ch-map draws its Expand button ONLY when asked, and only over a map that actually
        // rendered — never over the spinner, never over the island. That is exactly the
        // affordance we want: expandable when there is something to expand.
        expandable: true,
        // Draw the roads the quote was priced on: ops can pin a leg to the local road, and a
        // customer looking at an expressway line is looking at a different journey.
        runs: runs,
        onFail: function(){ host.innerHTML = art; },
      });
    }, { rootMargin: '200px' });
    io.observe(host);
  }

  // one row per calendar day — .hops rail, ticket.css's dot-and-line down the side, extended
  // here with STAY rows (a night with no journey) so a gap day reads as "you're resting", not
  // as a hole in the itinerary.
  function dayRowHtml(day, isLast){
    var isStay = day.kind === 'stay';
    var dotClass = 'hop-dot' + (isStay ? ' stay' : (isLast ? ' end' : ''));
    var lineHtml = isLast ? '' : '<span class="hop-line' + (isStay ? ' dash' : '') + '"></span>';
    var stops = (day.stops && day.stops.length)
      ? '<div class="stop-chain">' + day.stops.map(function(s){ return '<span>' + esc(s) + '</span>'; }).join('') + '</div>'
      : '';
    return '<div class="hop' + (isStay ? ' is-stay' : '') + '">'
      + '<div class="hop-rail"><span class="' + dotClass + '"></span>' + lineHtml + '</div>'
      + '<div><div class="hop-t">' + esc(day.title) + '</div>'
      + '<div class="hop-d">' + esc(day.date) + '</div>'
      + (day.meta ? '<div class="hop-m">' + esc(day.meta) + '</div>' : '')
      + stops
      + '</div></div>';
  }
  function daysHtml(days){
    days = days || [];
    return '<div class="hops">' + days.map(function(day, i){
      return dayRowHtml(day, i === days.length - 1);
    }).join('') + '</div>';
  }

  // Every option's action is WhatsApp, prefilled with the quote reference and the tapped
  // option's name (spec D6) — that prefill is how the customer's choice reaches ops, without
  // which both buttons would open the same bare chat and ops would have to ask which one.
  // The one sentence that does the customer's arithmetic (owner critique, 2026-08-06). The
  // delta line was cut from the cards as clutter, but the information had a job: $669 next to
  // $969 should not require mental subtraction, and what the gap buys should not hide
  // mid-sentence in an included box. One line, above both cards, priced once. Falls back to
  // the plain sentence whenever the pairing isn't the normal cheaper-private/dearer-chauffeur
  // shape, rather than inventing a phrasing for a case ops never sends.
  function fmtUsd(cents){
    var d = cents / 100;
    return '$' + (d % 1 === 0 ? d.toLocaleString('en-US') : d.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
  }
  function waysSubline(options){
    var base = 'Same itinerary, same vehicle.';
    if (options.length === 2 && typeof options[0].totalCents === 'number' && typeof options[1].totalCents === 'number') {
      var diff = options[1].totalCents - options[0].totalCents;
      if (diff > 0 && options[1].service === 'chauffeur') {
        return base + ' ' + fmtUsd(diff) + ' more keeps the driver with you the whole way.';
      }
      if (diff < 0 && options[1].service === 'private') {
        return base + ' Save ' + fmtUsd(-diff) + ' if you travel journey by journey.';
      }
    }
    return base + ' The difference is whether the driver stays with you.';
  }

  // IDENTICAL structure on both cards, row for row. No chip (owner critique, 2026-08-06):
  // the teal ring and the solid CTA already say "this is the one we quoted" — a third badge
  // was one signal more than the distinction needed, its label was ambiguous, and it broke
  // header parity (and 320px wrapping) on the card that didn't have one.
  //
  // Cancellation sits LAST, below the CTA: it is reassurance, not a selling point — styled
  // like a link in the delta's old slot it out-shouted the blurb — and opening its ladder
  // now only grows the card downward, never shoving the button mid-read (CH motion standard:
  // nothing snaps).
  function optionCardHtml(opt){
    var pol = opt.cancellation || { headline: '', ladder: [] };
    var ladder = (pol.ladder || []).map(function(li){ return '<li>' + esc(li) + '</li>'; }).join('');
    return '<div class="ticket' + (opt.lead ? ' opt-lead' : '') + '"><div class="t-main">'
      + '<div class="t-head"><h3 class="opt-n">' + esc(opt.name) + '</h3></div>'
      + '<p class="opt-d">' + esc(opt.blurb) + '</p>'
      + '<div class="included"><b>Included</b>' + esc(opt.includedText) + '</div>'
      // A negotiated price shows its two ends. These reconcile exactly — finishing runs before the
      // discount — so the customer can check the arithmetic and it holds.
      + (opt.discount
          ? '<div class="tot tot-sub"><span class="l">Total</span><span class="v">' + esc(opt.discount.totalBeforeUsd) + '</span></div>'
            + '<div class="tot tot-sub tot-disc"><span class="l">Discount</span><span class="v">&minus;' + esc(opt.discount.discountUsd) + '</span></div>'
            + '<div class="tot tot-final"><span class="l">Final total</span><span class="v">' + esc(opt.totalUsd) + '</span></div>'
          : '<div class="tot"><span class="l">Total</span><span class="v">' + esc(opt.totalUsd) + '</span></div>')
      // "Confirm on WhatsApp" on both cards (owner, 2026-08-06): "Book" over-promised — tapping
      // books nothing — and naming the channel makes the app-switch exactly what the label said.
      // Which option is being confirmed is carried by the card and the wa.me prefill.
      // data-opt is the analytics hook, and nothing else: which of the two ways to travel the
      // customer actually tapped. analytics.js's delegated wa.me listener already counts the
      // contact, but it cannot say WHICH option produced it — and "which option do people
      // choose when we offer both" is the question this page exists to answer.
      + '<a class="btn ' + (opt.lead ? 'btn-wa' : 'btn-ghost') + ' pp-cta" href="' + waHref(opt.waText) + '"'
      + ' target="_blank" rel="noopener"'
      + ' data-opt="' + esc(opt.service || opt.name || '') + '"'
      + ' data-opt-cents="' + Number(opt.totalCents || 0) + '">'
      + 'Confirm on WhatsApp</a>'
      + '<p class="paysub">Nothing is charged yet.</p>'
      + '<details class="dt-pol"><summary>' + esc(pol.headline) + '</summary><ul>' + ladder + '</ul></details>'
      + '</div></div>';
  }
  function optionsHtml(options){
    var cls = 'opts' + (options.length > 1 ? ' two' : '');
    return '<div class="' + cls + '">' + options.map(optionCardHtml).join('') + '</div>';
  }

  // ── states ──────────────────────────────────────────────────────────────────────────
  function renderLive(d, lapsed){
    var v = d.view;
    var html = '<div class="pp-hello"' + (v.greetingName ? MASK : '') + '>' + (v.greetingName ? 'Hi ' + esc(v.greetingName) + ',' : 'Hello,') + '</div>'
      + '<h1 class="pp-title">' + esc(v.title) + '</h1>'
      + '<p class="pp-sub">' + esc(v.subtitle) + '</p>'
      // No total in the hero (owner, 2026-08-06). The option card below IS the price, and
      // repeating it here read as a duplicate rather than a lead. `view.heroTotalUsd` and
      // `heroTotalNote` are still on the wire for the share card and the quote email.
      + heldRow(d.validUntil, lapsed);
    if (lapsed) {
      html += '<div class="lapse"><b>These prices are out of date</b>'
        + '<p>Everything below is still exactly the trip we planned — message us and we’ll refresh the price, usually within the hour.</p></div>'
        + '<a class="btn btn-wa pp-cta" href="' + waHref(v.waText) + '" target="_blank" rel="noopener" style="margin-top:14px">Get an up-to-date price</a>';
    }
    html += mapTicketHtml(v);
    if (v.options && v.options.length) {
      if (v.options.length > 1) {
        html += '<h2 style="font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--ink);margin:22px 0 0">Two ways to travel it</h2>'
          + '<p class="pp-sub" style="margin-bottom:0">' + esc(waysSubline(v.options)) + '</p>';
      }
      var optsHtml = optionsHtml(v.options);
      // Lapsing dims the PRICE, never the itinerary — the map and day-by-day below render at
      // full strength, because the trip they describe hasn't changed, only the number has.
      html += lapsed ? '<div class="stale">' + optsHtml + '</div>' : optsHtml;
    }
    html += '<div class="ticket"><div class="t-main">'
      + '<div class="t-head"><span class="t-ref">Day by day</span></div>'
      + daysHtml(v.days)
      + '</div></div>'
      + '<p class="pp-note">Anything you’d like changed — dates, stops, a bigger vehicle —<br>'
      + '<a href="' + waHref(v.waText) + '">just message us</a> and we’ll update this page.</p>';
    paint(html);
    // What we put in front of them, and at what price. `lapsed` rides along because an
    // expired price is a different offer from a live one even when the itinerary is identical.
    var opts = v.options || [];
    track('view_item_list', {
      item_list_id: 'customer_quote',
      currency: 'USD',
      lapsed: !!lapsed,
      items: opts.map(function(o, i){
        return {
          item_id: String(o.service || o.name || ('option_' + (i + 1))),
          item_name: String(o.name || ''),
          index: i,
          price: Math.round(Number(o.totalCents || 0)) / 100,
        };
      }),
    });
    if (lapsed) track('quote_lapsed_shown', { item_list_id: 'customer_quote' });
    mountMap(v.mapStops || [], v.mapRuns || []);
  }

  // The pay page's paid-screen pieces verbatim (ticket.css's .st-wrap/.st-badge/.refchip/.next),
  // plus the one thing it was missing: a road onward — "View your booking" goes to the manage
  // link, when the server sent one.
  function renderBooked(d){
    var b = d.booked || {};
    var waMsg = 'Hi! I have a question about my booking' + (b.reference ? ' ' + b.reference : '') + '.';
    paint('<div class="st-wrap">'
      + '<div class="st-badge ok">✓</div>'
      + '<h2 class="st-title"' + (b.firstName ? MASK : '') + '>You’re booked' + (b.firstName ? ', ' + esc(b.firstName) : '') + '</h2>'
      + '<p class="st-sub">' + esc(b.title || '') + '</p>'
      + (b.reference ? '<span class="refchip">' + esc(b.reference) + '</span>' : '')
      + '</div>'
      + (b.manageUrl ? '<a class="btn btn-ghost pp-cta" href="' + esc(b.manageUrl) + '" style="margin-top:2px">View your booking</a>' : '')
      + '<div class="next"><b>What happens next</b><ul>'
      + '<li>Your driver’s name and number arrive by WhatsApp 48 hours before pickup.</li>'
      + '<li>Anything to change before then — just message us.</li></ul></div>'
      + '<p class="pp-note"><a href="' + waHref(waMsg) + '">Message us</a></p>');
  }

  // The fifth state needs no new art: a bad token, a soft-deleted quote, or a status that
  // isn't payable all read the same as pay.html's dead-end — copied verbatim, illustration
  // and all, rather than inventing a second "this link doesn't work" screen.
  var SAILED_OFF_ART = '<svg class="de-art" viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A little paper boat sailing away from the shore while the coral map pin watches">'
    + '<defs>'
    + '<radialGradient id="deSky" cx="50%" cy="30%" r="80%"><stop offset="0%" stop-color="#fdfbf3"/><stop offset="100%" stop-color="#e7f4f0"/></radialGradient>'
    + '<linearGradient id="deSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a4ddd7"/><stop offset="100%" stop-color="#54c1ba"/></linearGradient>'
    + '<linearGradient id="deLand" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f4e7c8"/><stop offset="100%" stop-color="#e7d1a1"/></linearGradient>'
    + '</defs>'
    + '<rect width="480" height="300" fill="url(#deSky)"/>'
    + '<g transform="translate(398,54)"><g class="spin">'
    + '<circle r="19" fill="#f6b44c"/>'
    + '<g stroke="#f6b44c" stroke-width="3" stroke-linecap="round">'
    + '<line x1="0" y1="-26" x2="0" y2="-33"/><line x1="0" y1="26" x2="0" y2="33"/>'
    + '<line x1="-26" y1="0" x2="-33" y2="0"/><line x1="26" y1="0" x2="33" y2="0"/>'
    + '<line x1="-18.4" y1="-18.4" x2="-23.3" y2="-23.3"/><line x1="18.4" y1="18.4" x2="23.3" y2="23.3"/>'
    + '<line x1="-18.4" y1="18.4" x2="-23.3" y2="23.3"/><line x1="18.4" y1="-18.4" x2="23.3" y2="-23.3"/>'
    + '</g>'
    + '</g></g>'
    + '<g stroke="#6c6a6b" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".35">'
    + '<path d="M262 74 q6 -7 12 0 q6 -7 12 0"/>'
    + '<path d="M306 94 q5 -6 10 0 q5 -6 10 0"/>'
    + '</g>'
    + '<ellipse cx="250" cy="244" rx="280" ry="76" fill="url(#deSea)"/>'
    + '<g stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".55">'
    + '<path d="M228 234 q9 -6 18 0 t18 0"/>'
    + '<path d="M330 254 q9 -6 18 0 t18 0"/>'
    + '<path d="M262 276 q9 -6 18 0"/>'
    + '<path class="dash" d="M186 244 q10 -7 20 0 t20 0 t20 0" stroke-width="2.6"/>'
    + '</g>'
    + '<g class="bob">'
    + '<path d="M40 216 Q56 182 112 176 Q170 170 196 186 Q216 199 202 216 Q184 236 116 238 Q48 238 40 216 Z" fill="url(#deLand)" stroke="#d8c193" stroke-width="3"/>'
    + '<ellipse cx="78" cy="220" rx="13" ry="5" fill="#8fce9f"/>'
    + '<ellipse cx="166" cy="212" rx="11" ry="4.5" fill="#8fce9f"/>'
    + '<path d="M74 198 q-8 -26 3 -46" stroke="#9a6b3f" stroke-width="7" stroke-linecap="round" fill="none"/>'
    + '<g fill="#4bb08a">'
    + '<ellipse cx="63" cy="146" rx="17" ry="6.5" transform="rotate(-24 63 146)"/>'
    + '<ellipse cx="89" cy="148" rx="17" ry="6.5" transform="rotate(28 89 148)"/>'
    + '<ellipse cx="72" cy="140" rx="15" ry="6" transform="rotate(-68 72 140)"/>'
    + '<ellipse cx="84" cy="156" rx="15" ry="6" transform="rotate(60 84 156)"/>'
    + '</g>'
    + '<g transform="translate(142,164)"><g class="pin">'
    + '<path d="M0 26 C-13 8 -15 -4 0 -12 C15 -4 13 8 0 26 Z" fill="#ef6a4a"/>'
    + '<circle cx="0" cy="-1" r="7.5" fill="#fff"/>'
    + '<text x="0" y="3" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="11" fill="#ef6a4a">?</text>'
    + '</g></g>'
    + '</g>'
    + '<g transform="translate(312,212)"><g class="sail">'
    + '<path d="M-22 6 L22 6 L13 18 L-13 18 Z" fill="#fffdf8" stroke="#d8c193" stroke-width="2"/>'
    + '<path d="M-1 -20 L-1 4 L17 4 Z" fill="#fffdf8" stroke="#d8c193" stroke-width="1.8" stroke-dasharray="3 3"/>'
    + '<line x1="3" y1="-6" x2="10" y2="-6" stroke="#d8c193" stroke-width="1.6" stroke-linecap="round"/>'
    + '<line x1="3" y1="-1" x2="12" y2="-1" stroke="#d8c193" stroke-width="1.6" stroke-linecap="round"/>'
    + '</g></g>'
    + '</svg>';
  function renderUnavailable(){
    paint('<div class="de-wrap">'
      + SAILED_OFF_ART
      + '<p class="de-eyebrow">quote &middot; no longer active</p>'
      + '<h1 class="de-title">This quote has sailed off somewhere sunny</h1>'
      + '<p class="de-lead"><strong>Nothing has been charged.</strong> Message us on <strong>WhatsApp</strong> and we&rsquo;ll get you moving again.</p>'
      + '<div class="de-cta"><a class="btn btn-wa" href="https://wa.me/' + WA + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm0 18.15a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.24 8.24 0 1 1 6.97 3.86zm4.52-6.16c-.25-.12-1.47-.72-1.69-.8-.23-.08-.39-.12-.56.13-.16.25-.64.8-.79.97-.14.16-.29.18-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.16.04-.31-.02-.43-.06-.12-.56-1.35-.76-1.85-.2-.48-.41-.42-.56-.43h-.48c-.16 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.16 1.75 2.67 4.25 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.1-.22-.16-.47-.28z"/></svg> Chat on WhatsApp</a></div>'
      + '</div>');
  }

  // ── boot ────────────────────────────────────────────────────────────────────────────
  function load(){
    renderSkeleton();
    fetchJson(API + '/quote-view?t=' + encodeURIComponent(token)).then(function(r){
      return r.json();
    }).then(function(body){
      // Counted with the state it arrived in. "How many quotes get opened" and "how many get
      // opened after the price has already lapsed" are two different questions about how fast
      // ops needs to follow up, and neither had an answer.
      track('quote_link_opened', { state: String(body.state || 'unknown') });
      if (body.state === 'live') return renderLive(body, false);
      if (body.state === 'lapsed') return renderLive(body, true);
      if (body.state === 'booked') return renderBooked(body);
      renderUnavailable();
    }).catch(function(e){
      // Previously silent: a 500 from /quote-view showed the customer the same "this quote has
      // sailed off" screen a genuinely dead token gets, and told us nothing at all.
      report('quote-view failed', e);
      track('quote_link_opened', { state: 'error' });
      renderUnavailable();
    });
  }

  // One delegated listener, bound once, rather than re-binding on every paint. Capture phase
  // and never preventDefault — the link must still open WhatsApp exactly as before.
  document.addEventListener('click', function(ev){
    var a = ev.target && ev.target.closest ? ev.target.closest('a[data-opt]') : null;
    if (!a) return;
    track('select_item', {
      item_list_id: 'customer_quote',
      currency: 'USD',
      items: [{
        item_id: a.getAttribute('data-opt') || '',
        price: Math.round(Number(a.getAttribute('data-opt-cents') || 0)) / 100,
      }],
    });
  }, true);

  if (!token) {
    track('quote_link_opened', { state: 'no_token' });
    renderUnavailable();
  } else load();
})();
</script>
