<!DOCTYPE html>
<!-- PROTOTYPE, not shipped. Approved 2026-09-21; spec: docs/superpowers/specs/2026-09-21-trip-pages-redesign-design.md.
     Open from the repo root server (photos resolve to ../../img/). The dark "Mockup" bar is not part of the design. -->
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Page Redesign (prototype)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500..800&family=Poppins:wght@400;500;600;700&family=Caveat:wght@600&display=swap">
<style>
/* Ceylon Hop is a deliberately light-only brand (site.css: color-scheme: only light),
   so this mockup commits to one look and paints every colour explicitly. */
:root{
  color-scheme: only light;
  --blue:#63BFD6; --blue-deep:#24758A; --teal:#0AB9B6; --saffron:#F9A429; --tomato:#EC3A24;
  --cta:#C63A24; --ink:#3A3739; --ink-soft:#6c6a6b; --cream:#F0EEE5; --cream-deep:#E4E0D2;
  --paper:#fffdf8; --line:#e7e3d6; --wa:#2F7A47;
  --display:'Bodoni Moda','Didot',Georgia,serif;
  --body:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hand:'Caveat','Bradley Hand',cursive;
  --r:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.12;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue-deep);outline-offset:2px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:20px}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:.72rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--blue-deep)}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--blue)}

/* ── mock switcher (not part of the design) ── */
.mockbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--ink);color:#fff}
.mockbar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:9px}
.mockbar b{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--saffron)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;border-radius:999px;padding:6px 14px;font-size:.8rem;font-weight:500}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff;font-weight:600}

/* ── site header (simplified) ── */
.site-head{background:var(--paper);border-bottom:1px solid var(--line)}
.site-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-block:14px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:1.25rem;text-decoration:none}
.logo img{width:24px;height:30px}
.nav{display:flex;gap:26px;font-size:.88rem;font-weight:500}
.nav a{text-decoration:none}
.burger{display:none;width:26px;height:16px;border-block:2px solid var(--ink);position:relative}
.burger::after{content:"";position:absolute;inset:5px 0 auto;height:2px;background:var(--ink)}

/* ── hero ── */
.hero{position:relative;color:#fff;background:#23302b var(--photo) center/cover no-repeat;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(90deg,rgba(20,28,26,.78) 0%,rgba(20,28,26,.5) 48%,rgba(20,28,26,.12) 100%),
             linear-gradient(0deg,rgba(20,28,26,.55),rgba(20,28,26,0) 45%)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:48px;align-items:end;padding-block:30px 0}
.hero-copy{padding-bottom:74px;min-height:430px;display:flex;flex-direction:column;gap:16px}
.hero-copy .crumb{margin-bottom:auto}
.crumb{font-size:.8rem;opacity:.85}
.crumb a{text-decoration:none}
.hero .eyebrow{color:#fff}
.hero .eyebrow::before{background:var(--saffron)}
.hero h1{font-size:clamp(2.3rem,5.2vw,4.1rem);display:flex;flex-wrap:wrap;align-items:center;gap:.05em .32em}
.hero h1 svg{width:.95em;height:.5em;flex:none}
.hero-sub{max-width:34rem;font-size:1.02rem;color:rgba(255,255,255,.92)}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:4px 0 0;padding:0}
.chips li{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-size:.8rem;font-weight:500;
  background:rgba(20,28,26,.55);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px)}
.chips svg{width:15px;height:15px;flex:none}

/* fares card — overlaps the hero's bottom edge like the home booking widget */
.fares{background:var(--paper);color:var(--ink);border-radius:22px;padding:22px;margin-bottom:-64px;
  box-shadow:0 24px 60px -18px rgba(30,40,36,.45),0 2px 0 rgba(255,255,255,.6) inset;display:flex;flex-direction:column;gap:12px;position:relative;z-index:2}
.fares h2{font-size:1.35rem}
.fares .kick{font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.veh{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;
  background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.veh[aria-pressed="true"]{border-color:var(--blue-deep);box-shadow:0 0 0 3px rgba(99,191,214,.28)}
.veh svg{width:46px;height:30px;color:var(--blue-deep)}
.veh .nm{font-weight:600;font-size:.95rem;line-height:1.3}
.veh .cap{font-size:.78rem;color:var(--ink-soft)}
.veh .pr{font-weight:700;font-size:1.3rem;line-height:1.1;text-align:right;font-variant-numeric:tabular-nums}
.veh .pr small{display:block;font-weight:400;font-size:.68rem;color:var(--ink-soft)}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:999px;padding:15px 22px;
  font-weight:600;font-size:.98rem;text-decoration:none}
.btn-cta{background:var(--cta);color:#fff;box-shadow:0 12px 24px -10px rgba(198,58,36,.7)}
.btn-blue{background:var(--blue-deep);color:#fff}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-wa{background:var(--wa);color:#fff}
.btn svg{width:18px;height:18px}
.fine{font-size:.76rem;color:var(--ink-soft);text-align:center}
.share-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#FDF0D6;border:1px solid #F3D9A4;
  border-radius:14px;padding:11px 14px;font-size:.84rem;text-decoration:none}
.share-strip b{font-size:1.05rem}
.share-strip span:last-child{font-weight:600;color:var(--blue-deep);white-space:nowrap}

/* ── trust strip (home's) ── */
.trust{background:#22302F;color:#fff}
.trust ul{list-style:none;margin:0;padding:18px 0;display:flex;flex-wrap:wrap;gap:10px 30px;font-size:.82rem;font-weight:500;max-width:calc(100% - 440px)}
.trust li{display:flex;align-items:center;gap:8px}
.trust svg{width:16px;height:16px;color:var(--blue)}

.band{padding-block:84px}
.band-paper{background:var(--paper)}
.band-share{padding-top:120px}
.band-wash{background:linear-gradient(180deg,#E3EFE9,#EEF0E4)}
.sec-head{display:flex;flex-direction:column;gap:12px;margin-bottom:34px}
.sec-head h2{font-size:clamp(1.8rem,3.4vw,2.6rem)}
.lede{font-size:1.04rem;color:var(--ink-soft);max-width:36rem}

/* private-only note — one line, not half the page */
.note{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:36px;padding:14px 18px;border:1px dashed #cfcab8;border-radius:14px;font-size:.9rem;color:var(--ink-soft);max-width:calc(100% - 448px)}
.note a{font-weight:600;color:var(--blue-deep)}

/* ── shared ride section ── */
.share{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:48px;align-items:start}
.seat{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.seat small{font-size:.95rem;font-weight:500;color:var(--ink-soft)}
.tag{align-self:flex-start;background:var(--saffron);color:#3a2a08;font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:5px 12px}
.share-copy{display:flex;flex-direction:column;gap:16px}
.times{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:.92rem;margin:0}
.times dt{font-weight:600}
.times dd{margin:0;color:var(--ink-soft)}
.rides{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:10px}
.rides h3{font-family:var(--body);font-size:1rem;font-weight:600}
.ride{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none}
.avs{display:flex}
.avs i{width:28px;height:28px;border-radius:50%;border:2px solid #fff;margin-left:-8px;display:grid;place-items:center;font-style:normal;font-size:.68rem;font-weight:700;color:#fff}
.avs i:first-child{margin-left:0}
.ride .when{font-weight:600;font-size:.92rem;line-height:1.3}
.ride .st{font-size:.78rem;color:var(--ink-soft)}
.pill{font-size:.7rem;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.go{background:#DDF1E3;color:#1E6B39}
.pill.need{background:#FDF0D6;color:#8A5A06}

/* ── the drive: a route line with stops ── */
.drive{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:56px;align-items:center}
.stops{list-style:none;margin:26px 0 0;padding:0;position:relative}
.stops::before{content:"";position:absolute;left:11px;top:12px;bottom:12px;border-left:2px dotted var(--blue-deep);opacity:.55}
.stops li{position:relative;padding:0 0 16px 40px;font-size:.96rem}
.stops li::before{content:"";position:absolute;left:6px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--blue-deep)}
.stops li.end{font-family:var(--display);font-weight:700;font-size:1.15rem;padding-bottom:18px}
.stops li.end::before{left:2px;top:3px;width:20px;height:20px;background:var(--blue-deep);border-color:var(--paper);box-shadow:0 0 0 2px var(--blue-deep)}
.stops li.end.to::before{background:var(--cta);box-shadow:0 0 0 2px var(--cta)}
.stops li:last-child{padding-bottom:0}
.stops small{display:block;font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--ink-soft)}
.photo{position:relative;margin:0}
.photo img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:26px;max-width:100%}
.photo figcaption{position:absolute;left:18px;bottom:16px;background:var(--paper);border-radius:12px;padding:6px 14px;font-family:var(--hand);font-size:1.3rem;line-height:1.2;transform:rotate(-2deg);box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}

/* ── included + quote ── */
.inc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px}
.inc div{display:flex;flex-direction:column;gap:8px}
.inc svg{width:40px;height:40px;padding:9px;border-radius:50%;background:#D9EEF3;color:var(--blue-deep)}
.inc h3{font-family:var(--body);font-size:.98rem;font-weight:600}
.inc p{font-size:.86rem;color:var(--ink-soft)}
.quote{margin:48px 0 0;display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px 28px}
.quote img{width:64px;height:64px;border-radius:50%;object-fit:cover}
.quote blockquote{margin:0;font-family:var(--display);font-style:italic;font-size:1.08rem;line-height:1.45}
.quote cite{display:block;margin-top:6px;font-family:var(--body);font-style:normal;font-size:.8rem;color:var(--ink-soft)}
.ta{text-align:center;font-size:.76rem;color:var(--ink-soft);border-left:1px solid var(--line);padding-left:22px}
.ta b{display:block;font-size:1.7rem;color:var(--ink);line-height:1.1}
.ta span{color:var(--saffron);letter-spacing:2px}

/* ── FAQ accordion ── */
.faq{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:56px;align-items:start}
.faq-side{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.faq-side h2{font-size:clamp(1.8rem,3.4vw,2.6rem)}
.acc{border-top:1px solid #d5d0bf}
.acc details{border-bottom:1px solid #d5d0bf}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 2px;font-weight:600;font-size:1rem}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-size:1.5rem;font-weight:400;color:var(--blue-deep);line-height:1;flex:none}
.acc details[open] summary::after{content:"–"}
.acc p{padding:0 40px 20px 2px;color:var(--ink-soft);font-size:.94rem;max-width:40rem}

/* ── onward routes ── */
.next{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.rt{position:relative;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;transition:transform .2s,box-shadow .2s}
.rt:hover{transform:translateY(-3px);box-shadow:0 18px 34px -18px rgba(30,40,36,.45)}
.rt img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;max-width:100%}
.rt .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:3px}
.rt .nm{font-family:var(--display);font-weight:700;font-size:1.12rem;line-height:1.2}
.rt .mt{font-size:.78rem;color:var(--ink-soft)}
.rt .fr{margin-top:8px;font-size:.84rem}
.rt .fr b{font-size:1.08rem}
.rt .ret{position:absolute;top:10px;left:10px;background:var(--paper);border-radius:999px;padding:4px 10px;font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.all{display:inline-block;margin-top:24px;font-weight:600;color:var(--blue-deep)}

.foot{background:var(--ink);color:rgba(255,255,255,.7);font-size:.8rem;padding-block:26px 96px;text-align:center}

/* ── sticky mobile book bar ── */
.bookbar{display:none}

@media (max-width:900px){
  .nav{display:none}.burger{display:block}
  .hero .wrap{grid-template-columns:1fr;gap:0;padding-block:18px 0}
  .hero-copy{padding-bottom:56px;gap:12px}
  .hero-copy{min-height:340px}
  .hero::before{background:linear-gradient(0deg,rgba(20,28,26,.86) 0%,rgba(20,28,26,.35) 60%,rgba(20,28,26,.45) 100%)}
  .fares{margin-bottom:22px;margin-top:-36px;padding:18px}
  .band-share{padding-top:54px}
  .hero{background-color:var(--cream)}
  .trust ul,.note{max-width:none}
  .note{margin-top:24px}
  .trust ul{gap:8px 18px;font-size:.78rem}
  .band{padding-block:54px}
  .share,.drive,.faq{grid-template-columns:1fr;gap:30px}
  .inc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quote{grid-template-columns:auto 1fr;padding:20px}
  .ta{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:14px 0 0}
  .next{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .photo img{aspect-ratio:4/3}
  .acc p{padding-right:8px}
  .bookbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;align-items:center;justify-content:space-between;gap:14px;
    background:var(--paper);border-top:1px solid var(--line);box-shadow:0 -10px 30px -12px rgba(0,0,0,.25);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .bookbar .p{font-size:.74rem;color:var(--ink-soft);line-height:1.25}
  .bookbar .p b{display:block;font-size:1.2rem;color:var(--ink)}
  .bookbar .btn{padding:13px 26px}
}
/* On phones the fares card must sit on cream, not on the photo: the hero's photo ends where the copy ends. */
@media (max-width:900px){
  .hero{background-image:none}
  .hero::before{display:none}
  .hero-copy{position:relative;margin-inline:-20px;padding-inline:20px;background:#23302b var(--photo) center/cover no-repeat;isolation:isolate}
  .hero-copy::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(0deg,rgba(20,28,26,.88) 0%,rgba(20,28,26,.3) 62%,rgba(20,28,26,.5) 100%)}
  .hero .wrap{padding-top:0}
  .hero-copy{padding-top:18px}
}

/* ── routes index ── */
.ix-hero .wrap{grid-template-columns:minmax(0,1fr) 400px}
.ix-hero .hero-copy{min-height:340px}
.pick{display:flex;flex-direction:column;gap:6px}
.pick label{font-size:.66rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.pick input{width:100%;font:inherit;font-size:.95rem;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.pop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.rt .seatbadge{position:absolute;top:10px;right:10px;background:var(--saffron);color:#3a2a08;border-radius:999px;padding:4px 10px;font-size:.66rem;font-weight:700}
.fromsticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 46px);z-index:20;background:var(--cream);border-block:1px solid var(--line)}
.fromsticky .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
.fromsticky .lbl{font-size:.68rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap}
.fchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;border:1px solid #d5d0bf;background:var(--paper);border-radius:999px;padding:8px 15px;font-size:.84rem;font-weight:500}
.fchips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.origins{display:flex;flex-direction:column;gap:46px;padding-block:48px 84px}
.origin{display:grid;grid-template-columns:200px minmax(0,1fr);gap:34px;align-items:start}
.origin-head{display:flex;flex-direction:column;gap:6px;position:relative}
.origin-head img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--r);max-width:100%}
.origin-head h2{font-size:1.5rem;margin-top:8px}
.origin-head span{font-size:.8rem;color:var(--ink-soft)}
.dests{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 34px;border-top:1px solid #d5d0bf}
.dests a{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 14px;padding:14px 4px;border-bottom:1px solid #d5d0bf;text-decoration:none}
.dests a:hover .to{color:var(--blue-deep)}
.dests .to{font-weight:600;font-size:1rem;line-height:1.3}
.dests .to em{font-style:normal;color:var(--blue-deep);margin-right:6px}
.dests .mt{font-size:.78rem;color:var(--ink-soft)}
.dests .pr{grid-row:1/3;grid-column:2;text-align:right;font-size:.76rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.dests .pr b{font-size:1.08rem;color:var(--ink)}
.dests .sh{display:inline-block;margin-left:8px;background:#FDF0D6;color:#8A5A06;border-radius:999px;padding:2px 9px;font-size:.68rem;font-weight:700;vertical-align:1px}
.anywhere{background:#22302F;color:#fff}
.anywhere .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:center;padding-block:64px}
.anywhere h2{font-size:clamp(1.7rem,3.2vw,2.4rem)}
.anywhere p{color:rgba(255,255,255,.78);margin-top:10px;max-width:36rem}
.anywhere .acts{display:flex;flex-wrap:wrap;gap:12px}
.btn-line{border:1.5px solid rgba(255,255,255,.4);color:#fff;background:transparent}
@media (max-width:900px){
  .ix-hero .hero-copy{min-height:250px}
  .pop{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .fromsticky{top:calc(env(safe-area-inset-top,0px) + 0px);position:static}
  .fromsticky .lbl{display:none}
  .fromsticky .wrap{padding-inline:0}
  .fchips{padding-inline:20px}
  .origins{gap:36px;padding-block:32px 54px}
  .origin{grid-template-columns:1fr;gap:12px}
  .origin-head{flex-direction:row;align-items:center;gap:14px}
  .origin-head img{width:64px;aspect-ratio:1;border-radius:14px}
  .origin-head h2{margin-top:0;font-size:1.35rem}
  .origin-head div{display:flex;flex-direction:column}
  .dests{grid-template-columns:1fr}
  .anywhere .wrap{grid-template-columns:1fr;padding-block:48px}
}
@media (prefers-reduced-motion:reduce){.rt{transition:none}}
</style>
</head><body>

<div class="mockbar"><div class="wrap">

    document.getElementById('bookbar').innerHTML='<span class="p">AC '+v+' · total, fixed<b>$'+$(r[v])+'</b></span><a class="btn btn-cta" href="#">Choose date &amp; book</a>';
  }
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){
    b.addEventListener('click',function(){
      Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(o){o.setAttribute('aria-pressed',String(o===b))});
      var k=b.getAttribute('data-route');document.getElementById('bookbar').hidden=false;if(k==='ix'){renderIndex()}else{render(k)}window.scrollTo(0,0);
    });
  });
  render('ke');
})();
</script>
</body></html>
